name: Installer end-to-end verification

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux installer e2e
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - name: Install checkout and e2e tools
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates git tmux zsh jq python3 python3-yaml make

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: pfm/go.mod
          cache-dependency-path: pfm/go.sum

      # Exercise the fixture with system Bash; dev.sh verify templates runs it too.
      - name: Verify refresh scope with system Bash
        run: python3 scripts/test-refresh-scope.py

      - name: Run serial installer e2e
        shell: bash
        env:
          PFM_DEV_FENCE: "1"
          PFM_HARVESTPY_OFFLINE: "1"
        run: |
          set -euo pipefail
          export PFM_E2E_SOURCE_REPO="$GITHUB_WORKSPACE"
          export PFM_DEV_REPO_WORK_TREE="$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          PFM_DEV_REPO_GIT_DIR="$(git rev-parse --absolute-git-dir)"
          export PFM_DEV_REPO_GIT_DIR
          .claude/scripts/dev.sh e2e pfm

  darwin:
    name: Darwin installer e2e
    runs-on: macos-14
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: pfm/go.mod
          cache-dependency-path: pfm/go.sum

      - name: Install e2e tools
        run: brew install tmux jq

      # Exercise the fixture with system Bash; dev.sh verify templates runs it too.
      - name: Verify refresh scope with system Bash
        run: python3 scripts/test-refresh-scope.py

      # macOS runs these Go tests directly; the fence and timing budgets are Linux.
      - name: Verify native scheduler isolation and account migration
        env:
          PFM_DEV_FENCE: "1"
          PFM_HARVESTPY_OFFLINE: "1"
        run: go -C pfm test -count=1 ./internal/installer ./cmd/pfm -run 'TestInstall|TestMCP|TestRetire|TestLaunchAgent'

      # macOS runs these Go tests directly; the fence and timing budgets are Linux.
      - name: Run serial installer e2e
        env:
          PFM_DEV_FENCE: "1"
          PFM_HARVESTPY_OFFLINE: "1"
        run: |
          set -euo pipefail
          export PFM_E2E_SOURCE_REPO="$GITHUB_WORKSPACE"
          export PFM_DEV_REPO_WORK_TREE="$GITHUB_WORKSPACE"
          PFM_DEV_REPO_GIT_DIR="$(git rev-parse --absolute-git-dir)"
          export PFM_DEV_REPO_GIT_DIR
          go -C pfm test -count=1 -tags e2e -p 1 ./e2e/...
