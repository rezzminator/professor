# Professor global Codex defaults. Existing settings win on pfm install.
# Runtime instructions are appended by the native SessionStart hook from the staged
# harness-prompts/codex.md, composed from pfm/harness-prompts/.

[features.multi_agent_v2]
wait_agent_enabled = true
min_wait_timeout_ms = 150000
default_wait_timeout_ms = 750000
max_wait_timeout_ms = 1500000
