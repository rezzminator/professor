name: engine-sync binary
description: >-
  Builds engine-sync, the single writer of every Codex and OpenCode artifact
  (pfm codex|opencode forward to it), from the plugins/engine-sync submodule,
  stages the shipped machine policy templates/global/engine-sync.json as
  $HOME/.claude/engine-sync.json, the one file engine-sync reads, and exports
  ENGINE_SYNC_BIN to every later step of the job and puts the binary's
  directory on PATH. An absent source, a policy
  absent, unreadable or unstageable, or a different file already at the
  destination, fails the job naming it, never a skipped or neutral mirror
  step. Needs Go set up and the repository checked out.

runs:
  using: composite
  steps:
    - name: Stage the machine policy and build engine-sync from plugins/engine-sync
      shell: bash
      run: |
        set -euo pipefail
        policy="$GITHUB_WORKSPACE/templates/global/engine-sync.json"
        destination="$HOME/.claude/engine-sync.json"
        if [ ! -f "$policy" ] || [ ! -r "$policy" ]; then
          echo "::error::engine-sync machine policy absent or unreadable: $policy"
          exit 1
        fi
        if [ -e "$destination" ] || [ -L "$destination" ]; then
          if ! cmp -s "$policy" "$destination"; then
            echo "::error::engine-sync global file exists with other content, not overwritten: $destination"
            exit 1
          fi
        elif ! mkdir -p "$HOME/.claude" || ! cp "$policy" "$destination"; then
          echo "::error::engine-sync machine policy could not be staged from $policy into $destination"
          exit 1
        fi
        src="$GITHUB_WORKSPACE/plugins/engine-sync"
        cause=""
        if [ ! -f "$src/go.mod" ]; then
          cause="$(git -C "$GITHUB_WORKSPACE" submodule update --init -- plugins/engine-sync 2>&1)" || true
        fi
        if [ ! -f "$src/go.mod" ]; then
          echo "::error::engine-sync source absent: plugins/engine-sync has no go.mod — CI cannot build the Codex and OpenCode compiler (git submodule update: ${cause:-no output})"
          exit 1
        fi
        bin="$RUNNER_TEMP/engine-sync/engine-sync"
        go -C "$src" build -o "$bin" ./cmd/engine-sync
        "$bin" version
        printf 'ENGINE_SYNC_BIN=%s\n' "$bin" >> "$GITHUB_ENV"
        dirname "$bin" >> "$GITHUB_PATH"
