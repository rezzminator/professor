# go-test-coverage (version: infra/tools.env). Thresholds are a RATCHET like
# .arch/: measured, then raised as waves land, never lowered. The gate reads
# the merged profile `make cover` writes (unit + e2e binary runs).
profile: tmp/cover/merged.out
local-prefix: hostops/pfm
threshold:
  file: 0
  package: 52
  total: 77
exclude:
  paths:
    - ^internal/installer/assets/   # staged shell/JS/Python, not Go
    - ^internal/harvestpy/          # pinned Python sidecar
    - _test\.go$
breakdown-file-name: tmp/cover/breakdown.json
