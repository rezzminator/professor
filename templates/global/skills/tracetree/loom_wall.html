<template id="tpl-wall">
<div style="position:relative; width:1680px; height:1120px; overflow:hidden; background:#0F1426; color:#E8E6DF; font-family:var(--mono)">

        <span class="ell" style="flex:1; min-width:0; font-size:13px; color:#9AA3C2">{{head.sub}}</span>
      </div>
      <div class="ell" title="{{head.warn}}" style="font-size:11.5px; color:{{head.warnColor}}">{{head.warn}}</div>
    </div>
    <button class="bt ell" onClick="{{head.hubPick}}" title="{{head.hubTitle}}" style="position:absolute; left:24px; top:126px; max-width:300px; font-size:11px; color:#C9CED9">{{head.hub}}</button>

    <div style="position:absolute; left:676px; top:26px; display:flex; gap:14px">
      <sc-for list="{{stats}}" as="s" hint-placeholder-count="5">
        <div style="display:flex; flex-direction:column; gap:2px; min-width:60px">
          <div style="font-family:var(--display); font-weight:800; font-size:40px; line-height:1; color:{{s.color}}">{{s.big}}</div>
          <div style="font-size:10.5px; letter-spacing:0.08em; text-transform:uppercase; color:#9AA3C2">{{s.label}}</div>
        </div>
      </sc-for>
    </div>

    <div style="position:absolute; left:1262px; top:18px; width:394px; display:flex; flex-direction:column; gap:8px">
      <div style="display:flex; gap:6px">
        <sc-for list="{{runs}}" as="r" hint-placeholder-count="3">
          <button class="bt" onClick="{{r.pick}}" aria-pressed="{{r.pressed}}" style="flex:1; min-width:0; height:44px; padding:5px 9px; border-radius:7px; border:1px solid {{r.border}}; background:{{r.bg}}; display:flex; flex-direction:column; justify-content:center; gap:1px">

      </div>
      <sc-for list="{{bars}}" as="b" hint-placeholder-count="2">

          <div style="flex:1; min-width:0; display:flex; flex-direction:column; gap:3px">

              <sc-for list="{{b.parts}}" as="p"><span title="{{p.title}}" style="width:{{p.w}}%; background:{{p.c}}"></span></sc-for>
            </div>

          </div>
        </div>
      </sc-for>
    </div>

    <div style="position:absolute; left:24px; top:194px; font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color:#7D86A8">{{leftHead}}</div>
    <div style="position:absolute; left:1434px; top:194px; font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color:#7D86A8">{{rightHead}}</div>

    <canvas class="wall" ref="{{cvRef}}" tabindex="0" aria-label="{{wallAria}}" width="1080" height="732" style="position:absolute; left:340px; top:140px; width:1080px; height:732px; touch-action:none; cursor:grab"></canvas>

    <sc-if value="{{wallMsg.on}}" hint-placeholder-val="{{ false }}">

    </sc-if>

    <div style="position:absolute; left:352px; top:826px; display:flex; align-items:center; gap:6px">
      <button class="bt zb" onClick="{{zoomOut}}" aria-label="Zoom out" title="Zoom out (−)" style="font-size:16px">−</button>
      <button class="bt zb" onClick="{{zoomIn}}" aria-label="Zoom in" title="Zoom in (+)" style="font-size:16px">+</button>
      <button class="bt zb" onClick="{{fitAll}}" title="The whole wall at once (F)">Fit</button>

      <span ref="{{zoomRef}}" style="margin-left:6px; padding:0 10px; height:26px; display:flex; align-items:center; border-radius:13px; background:rgba(15,20,38,0.88); font-size:11px; color:#C9CED9; white-space:nowrap"></span>

    <div ref="{{tipRef}}" style="position:absolute; left:0; top:0; display:none; max-width:360px; padding:7px 10px; border-radius:6px; background:#1A2140; border:1px solid #3A4677; border-left:3px solid #9AA3C2; box-shadow:0 10px 30px rgba(0,0,0,0.5); font-size:11px; line-height:1.45; color:#E8E6DF; white-space:pre-line; pointer-events:none"></div>

    <sc-if value="{{listOn}}" hint-placeholder-val="{{ true }}">

    <sc-if value="{{card.on}}" hint-placeholder-val="{{ false }}">

        <div style="display:flex; align-items:center; gap:8px">
          <button class="bt" onClick="{{card.prev}}" aria-label="Previous reader" title="Previous reader ([)" style="width:44px; height:36px; border-radius:18px; border:1px solid #3A4677; display:flex; align-items:center; justify-content:center; font-size:15px">‹</button>

        <div style="font-family:var(--display); font-weight:800; font-size:30px; line-height:1; color:{{card.color}}">{{card.title}}</div>
        <div class="cl6" title="{{card.text}}" style="font-family:var(--sans); font-size:13px; line-height:1.45; color:#F3F1EA">{{card.text}}</div>
        <div style="font-size:11px; line-height:1.5; color:#9AA3C2">{{card.stats}}</div>

        </div>
        <div style="font-size:10.5px; color:#9AA3C2">{{card.from}}</div>
        <div class="scroller" style="display:flex; flex-direction:column; gap:6px; overflow:auto; min-height:0; flex:1">
          <sc-for list="{{card.open}}" as="o" hint-placeholder-count="3">
            <button class="bt" onClick="{{o.go}}" title="{{o.full}}" style="flex:none; display:flex; gap:8px; font-size:11px; line-height:1.4">
              <span style="flex:none; width:62px; color:{{o.kc}}">{{o.k}}</span>
              <span class="cl3" style="flex:1; min-width:0; color:#C9CED9">{{o.t}}</span>
            </button>
          </sc-for>
        </div>
        <a href="#custody" style="font-size:12px; text-decoration:none">Open its chain of custody →</a>
      </div>
    </sc-if>

    <div class="scroller" style="position:absolute; left:1434px; top:214px; width:226px; height:658px; overflow-y:auto; overflow-x:hidden; display:flex; flex-direction:column; gap:6px; padding-right:4px; box-sizing:border-box">
      <sc-if value="{{hop.on}}" hint-placeholder-val="{{ false }}">
        <div class="in" style="flex:none; display:flex; flex-direction:column; gap:4px; padding:9px 10px; border-radius:8px; background:#1A2140; border:1px solid {{hop.color}}">
          <div style="display:flex; align-items:center; gap:6px; font-size:11px">
            <span style="color:#7D86A8">#{{hop.n}}</span>
            <span style="font-weight:600; color:{{hop.stc}}">{{hop.st}}</span>
            <span style="margin-left:auto; color:#C9CED9">{{hop.link}}</span>
          </div>
          <div style="font-size:11px; color:#F3F1EA; word-break:break-all">{{hop.where}}</div>
          <sc-if value="{{hop.hasNote}}" hint-placeholder-val="{{ true }}">
            <div class="cl6" title="{{hop.note}}" style="font-family:var(--sans); font-size:12px; line-height:1.4; color:#C9CED9">= {{hop.note}}</div>
          </sc-if>
          <sc-if value="{{hop.hasFlag}}" hint-placeholder-val="{{ false }}">
            <div class="cl3" title="{{hop.flag}}" style="font-size:10.5px; line-height:1.4; color:#F2B33D">{{hop.flag}}</div>
          </sc-if>
          <div style="display:flex; flex-wrap:wrap; gap:4px">
            <sc-for list="{{hop.cites}}" as="c"><span title="{{c.title}}" style="padding:0 6px; border-radius:8px; border:1px solid {{c.color}}; color:{{c.color}}; font-size:10.5px">{{c.label}}</span></sc-for>
          </div>
        </div>
      </sc-if>
      <sc-for list="{{claims}}" as="a" hint-placeholder-count="4">
        <button class="bt" onClick="{{a.go}}" title="{{a.full}}" style="flex:none; display:flex; flex-direction:column; gap:2px; padding:6px 8px; border-radius:6px; border:1px solid {{a.border}}; min-height:44px; box-sizing:border-box">
          <span style="font-size:10.5px; font-weight:600; color:{{a.color}}">{{a.label}}</span>
          <span class="cl2" style="font-family:var(--sans); font-size:11.5px; line-height:1.35; color:#C9CED9">{{a.t}}</span>
        </button>
      </sc-for>
      <sc-if value="{{key.on}}" hint-placeholder-val="{{ true }}">
        <div style="flex:none; display:flex; flex-direction:column; gap:10px">
          <div style="font-family:var(--sans); font-size:12.5px; line-height:1.45; color:#E8E6DF">{{key.facts}}</div>
          <div style="font-family:var(--sans); font-size:11.5px; line-height:1.45; color:#9AA3C2">{{key.src}}</div>
          <div style="display:flex; flex-direction:column; gap:5px">
            <sc-for list="{{key.items}}" as="k" hint-placeholder-count="8">
              <div style="display:flex; align-items:center; gap:8px; font-size:10.5px; color:#C9CED9">
                <svg aria-hidden="true" width="34" height="16" style="flex:none"><path d="{{k.d1}}" style="{{k.s1}}"></path><path d="{{k.d2}}" style="{{k.s2}}"></path><path d="{{k.d3}}" style="{{k.s3}}"></path></svg>
                <span>{{k.t}}</span>
              </div>
            </sc-for>
          </div>
          <div style="font-size:10.5px; line-height:1.6; color:#9AA3C2">⌘-scroll or pinch · zoom<br>drag or scroll · pan<br>double-click · dive in<br>click a stitch · read its lines<br>+ − F Z · zoom, fit, fold</div>
          <a href="#key" style="font-size:11.5px; text-decoration:none">The full stitch key →</a>
        </div>
      </sc-if>
    </div>

    <div style="position:absolute; left:24px; top:900px; width:300px; display:flex; flex-direction:column; gap:6px">
      <div style="font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color:#7D86A8">Run clock</div>
      <div style="font-family:var(--sans); font-size:12px; line-height:1.4; color:#9AA3C2">Each bar is one reader, from <span style="font-family:var(--mono)">tt start</span> to its write. The kit stores a reader's hops when it writes, so the replay sews each walk onto the wall at that moment, hop by hop.</div>
      <div style="display:flex; gap:8px; margin-top:4px">
        <button class="bt" onClick="{{play}}" aria-label="{{playAria}}" style="height:44px; padding:0 18px; border-radius:22px; background:#FFB454; color:#14161F; font-size:12.5px; font-weight:600; display:flex; align-items:center; gap:8px">
          <svg aria-hidden="true" width="12" height="12"><path d="{{playIcon}}" style="fill:#14161F"></path></svg>{{playLabel}}
        </button>
        <sc-if value="{{hasSel}}" hint-placeholder-val="{{ false }}">
          <button class="bt" onClick="{{clear}}" style="height:44px; padding:0 16px; border-radius:22px; border:1px solid #3A4677; font-size:12px; color:#E8E6DF">Clear focus</button>
        </sc-if>
      </div>
    </div>

    <svg aria-hidden="true" width="1680" height="1120" style="position:absolute; left:0; top:0; pointer-events:none">
      <path d="{{clock.grid}}" style="fill:none; stroke:#262F52; stroke-width:1"></path>
      <path d="{{clock.area}}" style="fill:rgba(255,180,84,0.16); stroke:none"></path>
      <path d="{{clock.line}}" style="fill:none; stroke:#FFB454; stroke-width:1.3"></path>
      <path d="{{clock.done}}" style="fill:none; stroke:#8FE3B0; stroke-width:1.2; stroke-dasharray:3 3"></path>
    </svg>
    <sc-if value="{{playing}}" hint-placeholder-val="{{ false }}">
      <div class="head" style="position:absolute; left:340px; top:894px; width:2px; height:194px; background:#F3F1EA; transform:translateX(0px)"></div>
    </sc-if>
    <div style="position:absolute; left:1426px; top:1066px; font-size:10px; color:#8FE3B0">{{clock.doneLabel}}</div>
    <div style="position:absolute; left:1426px; top:898px; font-size:10px; color:#FFB454">{{clock.peakLabel}}</div>
    <sc-for list="{{lanes}}" as="l" hint-placeholder-count="12">
      <div class="grow" title="{{l.title}}" style="position:absolute; left:{{l.x}}px; top:{{l.y}}px; width:{{l.w}}px; height:{{l.h}}px; border-radius:2px; background:{{l.color}}; opacity:{{l.op}}; transition:opacity .3s ease; transform-origin:0 50%; transform:scaleX({{l.f}})"></div>
    </sc-for>
    <sc-for list="{{ticks}}" as="t" hint-placeholder-count="5">
      <div style="position:absolute; left:{{t.x}}px; top:1092px; font-size:10px; color:#7D86A8">{{t.label}}</div>
    </sc-for>
    <a href="#key" style="position:absolute; left:24px; top:1072px; font-size:11.5px; text-decoration:none">Stitch key — how to read the cloth →</a>
  </sc-if>
</div>
</template>
<script>
(function () {
const DCLogic = DC.DCLogic;
// the wall canvas sits at (340,140) on the board, 1080 x 732; its top 74 px are the file-label band
const CW = 1080, CHT = 732, LB = 74, MIDY = LB + (CHT - LB) / 2, X0 = 340, X1 = 1420;
// world units: one source line is 1 unit tall, a file column COLW wide (the kit's own proportions)
const COLW = 54, GAP = 34, DGAP = 30, FOLD_H = 7, CTX = 10, CHU = 0.37, KREAD = 19, KMIN = 0.02, KMAX = 26, KTEXT = 8.5, KLINES = 1.6;
const OVW = 196, OVH = 112, OVX = CW - OVW - 12, OVY = CHT - OVH - 12;
const HUES = ['#FFB454', '#5DD6F5', '#FF7EB6', '#A6E36A', '#B9A2FF', '#FF8F5E', '#6FE3C1', '#F4E06D'];
const UNDYED = '#C9CED9';
const HOPC = { exact: '#E8E6DF', moved: '#AFC0F0', placed: '#7FD1FF', drifted: '#F2B33D', rejected: '#FF5A5F' };
const ANSC = { held: '#8FE3B0', moved: '#7FD1FF', drift: '#F2B33D', unbacked: '#FF8A65', missing: '#FF5A5F', broke: '#D7263D', uncited: '#7D86A8' };
const ANSW = { held: 'held', moved: 'moved', drift: 'drifted', unbacked: 'unbacked', missing: 'quote not found', broke: 'contract broken', uncited: 'no cite' };
const STW = { verified: ['held', '#8FE3B0'], moved: ['moved ↻', '#AFC0F0'], placed: ['placed', '#7FD1FF'], followed: ['followed', '#7FD1FF'], drifted: ['worn ≈ changed since the walk', '#F2B33D'], rejected: ['hole ✗ quote not found', '#FF5A5F'], badaddr: ['hole ✗ bad address', '#FF5A5F'] };
const STS = { verified: 'held', moved: 'moved ↻', placed: 'placed', followed: 'followed', drifted: 'worn ≈', rejected: 'hole ✗', badaddr: 'hole ✗' };
const LINKW = { call: '→ call', names: '⇢ names', then: '· then', same: '= same' };
const KW = new Set('func package import return if else for range switch case default type struct interface var const go defer chan map def class from as with try except finally raise pass lambda yield while in not and or is None True False self let fn pub use mod impl match mut async await new this function export extends static true false nil null undefined break continue elif local then fi do done esac echo select where'.split(' '));
const COMMENT = /^\s*(\/\/|#|\/\*|\*|--|;|<!--|%)/;
const TOKRX = /(\/\/.*$)|("(?:[^"\\]|\\.)*"?|'(?:[^'\\]|\\.)*'?|`[^`]*`?)|(\b\d[\w.]*)|([A-Za-z_]\w*)|(\s+)|([^\sA-Za-z_\d"'`]+)/g;
const r1 = (v) => Math.round(v * 10) / 10;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const hue = (q) => (q == null ? UNDYED : HUES[(q - 1) % HUES.length]);
const withA = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`; };
const tidy = (s) => String(s || '').replace(/^`?tt start`? prints its text\s*(\([^)]*\))?\s*[—–-]?\s*/i, '').trim();
const mmss = (s) => { if (s == null) return '—'; s = Math.round(s); return s >= 60 ? `${Math.floor(s / 60)}m ${String(s % 60).padStart(2, '0')}s` : `${s}s`; }; // an unknown time is —, never 0s
const whenOf = (id) => { const m = /^(\d{4})(\d{2})(\d{2})-(\d{2})(\d{2})/.exec(id); const mon = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; return m ? `${Number(m[3])} ${mon[Number(m[2]) - 1]} ${m[4]}:${m[5]}` : id; };
const idCmp = (a, b) => { const x = a.split('.').map(Number), y = b.split('.').map(Number); for (let i = 0; i < Math.max(x.length, y.length); i++) { const d = (x[i] ?? -1) - (y[i] ?? -1); if (d) return d; } return 0; };
const base = (p) => String(p || '').split('/').pop();
const dirOf = (p) => { const i = String(p).lastIndexOf('/'); return i < 0 ? '.' : p.slice(0, i); };
const isHole = (st) => st === 'rejected' || st === 'badaddr';
const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const indentOf = (t) => { let n = 0; for (const ch of t) { if (ch === ' ') n++; else if (ch === '\t') n += 4; else break; } return n; };
const reduced = () => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } };

function buildPieces(col) {
  const keep = col.steps.map((s) => [s.a - CTX, Math.min(s.b, col.n) + CTX]).sort((a, b) => a[0] - b[0]);
  const merged = [];
  for (const [a0, b0] of keep) {
    const a = clamp(a0, 1, col.n), b = clamp(b0, 1, col.n), last = merged[merged.length - 1];
    if (last && a <= last[1] + 6) last[1] = Math.max(last[1], b); else merged.push([a, b]);
  }
  const pieces = [];

      hubPick: () => { if (hubC && hubCol) { this.set({ follow: null, hop: null, selQ: undefined }); this.flyToLines(hubCol, hubC.a || 1, hubC.z || hubC.a || 1, '#FFB454'); } } };

    // readers, by question
    const groups = L.groups.map((gq) => ({
      label: gq.g == null ? 'Q?' : `Q${gq.g}`, color: hue(gq.g), pressed: S.selQ === gq.g ? 'true' : 'false', bg: S.selQ === gq.g ? '#1E2747' : 'transparent',
      text: gq.g == null ? 'readers the kit could not tie to a question' : run.questions[String(gq.g)] || '',
      full: gq.g == null ? 'Readers whose QUESTION the kit could not match' : `Question ${gq.g}: ${run.questions[String(gq.g)] || ''} — click to light its readers`,
      pick: () => { const was = S.selQ === gq.g; this.set({ selQ: was ? undefined : gq.g, follow: null, hop: null }); if (!was) this.fitSteps(gq.rows.flatMap((r) => W.thById[r.t.id].steps), 6); },
      rows: gq.rows.map((r) => {
        const t = r.t, TT = W.thById[t.id], hd = t.steps.filter((s) => s.st === 'drifted').length, ho = t.steps.filter((s) => isHole(s.st)).length;
        const bad = t.answers.filter((a) => !['held', 'moved', 'uncited'].includes(a.g)).length;
        return { idText: (r.d ? '└ ' : '') + t.id, text: tidy(t.text), color: hue(r.g), pad: 8 + r.d * 12,
          stats: `${t.steps.length} hops${hd ? ' · ' + hd + ' worn' : ''}${ho ? ' · ' + ho + ' holes' : ''} · ${t.answers.length} claims${bad ? ' · ' + bad + ' flagged' : ''}${t.w == null ? ' · never wrote' : ''}`,
          bg: S.hovT === t.id ? '#1E2747' : 'transparent', op: !anyF || fIds.has(t.id) ? 1 : 0.45,
          aria: `Follow reader ${t.id} on the wall: ${tidy(t.text)}`,
          pick: () => this.follow(t.id), enter: () => this.set({ hovT: t.id }), leave: () => { if (this.state.hovT === t.id) this.set({ hovT: null }); }, _T: TT };
      }),
    }));

    // the followed reader
    let card = { on: false, open: [] }, claims = [], hop = { on: false, cites: [] };
    if (fT) {
      const t = fT.t, gcount = {};
      t.answers.forEach((a) => { gcount[a.g] = (gcount[a.g] || 0) + 1; });
      const open = [];
      const goAt = (at) => () => { const m = /^(.*):(\d+)$/.exec(at || ''); const col = m ? W.findCol(m[1]) : null; if (col) this.flyToLines(col, clamp(Number(m[2]), 1, col.n), clamp(Number(m[2]), 1, col.n), fT.color); };
      t.end.forEach((e) => open.push({ k: `■ ${e.k || 'END'}`, kc: '#C9CED9', t: e.t, full: `${e.t}${e.at ? ' @ ' + e.at : ''}`, go: goAt(e.at) }));
      t.lead.forEach((e) => open.push({ k: 'LEAD', kc: '#FFB454', t: e.t, full: `${e.t}${e.at ? ' @ ' + e.at : ''}`, go: goAt(e.at) }));
      t.notread.forEach((e) => open.push({ k: 'NOT READ', kc: '#FF8A65', t: e.t, full: e.t, go: () => {} }));
      t.split.forEach((e) => open.push({ k: 'SPLIT', kc: '#7FD1FF', t: `${e.child || ''} ${e.t}${e.spawned ? '' : ' — never spawned'}`, full: `${e.t}${e.at ? ' @ ' + e.at : ''}`, go: e.child && W.thById[e.child] ? () => this.follow(e.child) : goAt(e.at) }));
      if (!t.end.length) open.unshift({ k: 'no END', kc: '#FF8A65', t: 'the reader wrote no END line', full: '', go: () => {} });
      const hd = t.steps.filter((s) => s.st === 'drifted').length, ho = t.steps.filter((s) => isHole(s.st)).length, mv = t.steps.filter((s) => s.st === 'moved').length;
      const cj = hopSt && hopSt.T === fT ? hopSt.j : -1;
      card = { on: true, color: fT.color, title: `${fT.q == null ? 'Q?' : 'Q' + fT.q} · reader ${t.id}`, text: tidy(t.text),
        stats: `${t.steps.length} hops · ${t.steps.length - hd - ho - mv} held · ${mv} moved · ${hd} worn · ${ho} holes · read for ${t.s != null && t.w != null ? mmss(t.w - t.s) : '—'}${t.refused ? ' · first write refused' : ''} · ${t.answers.length} claims`,
        from: t.from ? `tt start @ ${t.from}` : '', open,
        hopLabel: t.steps.length ? (cj >= 0 ? `hop ${cj + 1} of ${t.steps.length}` : `${t.steps.length} hops — step through them`) : 'no hops written',
        hopWhere: cj >= 0 ? `${hopSt.col.path}:${hopSt.s.a}${hopSt.s.b > hopSt.s.a ? '–' + hopSt.s.b : ''}` : 'arrow keys walk the hops',
        hopPrev: () => this.hopStep(-1), hopNext: () => this.hopStep(1), prev: () => this.readerStep(-1), next: () => this.readerStep(1), close: () => this.clearAll() };
      const citedBy = {};
      t.answers.forEach((a, i) => a.cites.forEach((c) => { if (c.s >= 0) (citedBy[c.s] = citedBy[c.s] || []).push({ i, g: a.g, t: a.t }); }));
      claims = t.answers.map((a, i) => {
        const onWall = a.cites.some((c) => W.findCol(c.p));
        const hit = cj >= 0 && a.cites.some((c) => c.s === cj);
        return { label: `A${i + 1} · ${ANSW[a.g] || a.g}${a.cites.length ? (onWall ? '' : ' · file not on the wall') : ''}`, color: ANSC[a.g] || '#C9CED9', t: a.t,
          border: hit ? (ANSC[a.g] || '#C9CED9') : '#262F52',
          full: `${a.t}${a.cites.length ? '\n' + a.cites.map((c) => `[${c.p}:${c.l}] ${c.g}`).join('\n') : ''}${a.why && a.why.length ? '\n' + a.why.join('\n') : ''}`,
          go: () => this.claimGo(a) };
      });
      if (hopSt && hopSt.T === fT) {
        const s = hopSt, stw = STW[s.st] || [s.st, '#C9CED9'];
        hop = { on: true, n: s.j + 1, st: stw[0], stc: stw[1], color: fT.color, link: s.j && s.ln ? LINKW[s.ln] || '' : 'first hop',
          where: `${s.col.path}:${s.s.a}${s.s.b > s.s.a ? '–' + s.s.b : ''}`, hasNote: !!s.s.note, note: s.s.note, hasFlag: !!s.s.flag, flag: s.s.flag,
          cites: (citedBy[s.j] || []).map((c) => ({ label: `A${c.i + 1}`, color: ANSC[c.g] || '#C9CED9', title: `A${c.i + 1} · ${ANSW[c.g] || c.g}: ${c.t}` })) };
      }
    }

    // what the wall holds, when nobody is followed
    const totalLines = W.cols.reduce((a, c) => a + (c.lines ? c.lines.length : 0), 0);
    const srcN = { disk: 0, sparse: 0, none: 0 };
    W.cols.forEach((c) => { if (c.src) srcN[c.src] = (srcN[c.src] || 0) + 1; });
    const hk = (d1, s1, d2, s2, d3, s3, t) => ({ d1, s1, d2: d2 || '', s2: s2 || 'fill:none', d3: d3 || '', s3: s3 || 'fill:none', t });
    const key = { on: !fT,
      facts: `${W.cols.length} files hung as warp, ${totalLines.toLocaleString('en-US')} lines of source at true scale; ${W.th.length} readers woven through them in ${W.steps.length} stitches.`,
      src: this.texts[ri] ? [srcN.disk ? `${srcN.disk} files as they sat on disk when the page was made` : '', srcN.sparse ? `${srcN.sparse} past the page's text budget, carried only near their hops` : '', srcN.none ? `${srcN.none} unreadable (hatched)` : ''].filter(Boolean).join(' · ') + '.' : '',
      items: [
        hk('M2 3h30v10H2z', 'fill:rgba(255,180,84,0.4)', 'M2 3h2.6v10H2z', 'fill:#FFB454', '', '', 'held — a hop, dyed by its question'),
        hk('M2 3h30v10H2z', 'fill:rgba(255,180,84,0.4)', 'M2 3h2.6v10H2z', 'fill:#FFB454', 'M2.3 8a1 1 0 1 0 2 0a1 1 0 1 0 -2 0', 'fill:#0F1426', 'moved — found a few lines away'),
        hk('M2 3h30v10H2z', 'fill:rgba(255,180,84,0.4)', 'M0.5 1.5h33v13H0.5z', 'fill:none;stroke:#7FD1FF;stroke-dasharray:2 2', '', '', 'placed or followed'),
        hk('M2 3h28v10H2z', 'fill:rgba(255,180,84,0.4)', 'M1 2h30v12H1z', 'fill:none;stroke:#F2B33D;stroke-width:1.3;stroke-dasharray:1.2 2.2', 'M31 2l3 -2M31 14l3 2', 'stroke:#F2B33D', 'worn — the code changed since'),
        hk('M12 8a5 5 0 1 0 10 0a5 5 0 1 0 -10 0', 'fill:#0B0F1E;stroke:#FF5A5F;stroke-width:1.3', 'M14.3 5.3l5.4 5.4M19.7 5.3l-5.4 5.4', 'stroke:#FF5A5F;stroke-width:1.3', '', '', 'hole — no file holds the quote'),
        hk('M2 12C14 12 20 4 32 4', 'fill:none;stroke:#FFB454;stroke-width:1.3', '', '', '', '', 'call — the code links them'),
        hk('M2 12C14 12 20 4 32 4', 'fill:none;stroke:#FFB454;stroke-width:1.3;stroke-dasharray:6 4', '', '', '', '', 'names — one names the other'),
        hk('M2 12C14 12 20 4 32 4', 'fill:none;stroke:#FFB454;stroke-width:1;stroke-dasharray:1.5 4;stroke-linecap:round', '', '', '', '', 'then — walk order only'),
        hk('M10 3l4.2 4.2 -4.2 4.2 -4.2 -4.2z', 'fill:#FFB454;stroke:#FFB454', 'M18 4c2 3 -2 5 0 10M22 4c2 3 -2 5 0 10M26 4c2 3 -2 5 0 10', 'fill:none;stroke:#FFB454', '', '', 'END knot, and its open fringe'),
      ] };

    const wallMsg = { on: false };

    // the run clock
    const C_TOP = 900, C_BASE = 930, LANE0 = 938, LANE1 = 1084;
    const tx = (t) => X0 + ((X1 - X0) * t) / L.dur;
    const laneH = Math.min(9, (LANE1 - LANE0) / Math.max(1, L.order.length));
    const lanes = L.order.map((r, i) => {
      const t = r.t, s = t.s ?? 0, w = t.w ?? L.dur;
      return { x: r1(tx(s)), y: r1(LANE0 + i * laneH), w: r1(Math.max(2, tx(w) - tx(s))), h: r1(Math.max(1.5, laneH - 1.6)), color: hue(r.g),
        op: !anyF || fIds.has(t.id) ? 0.95 : 0.15,
        f: playing ? 0 : 1,
        title: `Thread ${t.id}: started ${mmss(t.s)}, wrote ${t.w != null ? mmss(t.w) : 'never'}${t.refused ? ' — first write refused' : ''}` };
    });
    let area = `M${X0} ${C_BASE}`, line = '', c2 = 0;
    events.forEach((e, i) => {
      const xx = r1(tx(e[0])), y1 = r1(C_BASE - (26 * c2) / Math.max(1, peak));
      c2 += e[1];
      const y2 = r1(C_BASE - (26 * c2) / Math.max(1, peak));
      area += `L${xx} ${y1}L${xx} ${y2}`;
      line += `${i ? 'L' : 'M'}${xx} ${y1}L${xx} ${y2}`;
    });
    area += `L${X1} ${C_BASE}Z`;
    const stepS = L.dur > 420 ? 120 : L.dur > 160 ? 60 : 30;
    const ticks = [];
    let grid = '';
    for (let s = 0; s <= L.dur + 0.1; s += stepS) { ticks.push({ x: r1(tx(s) - 4), label: s ? mmss(s) : '0' }); grid += `M${r1(tx(s))} ${C_TOP}V${LANE1}`; }
    const clock = { area, line, grid, done: run.dur == null ? '' : `M${r1(tx(run.dur))} ${C_TOP}V${LANE1}`, doneLabel: run.dur == null ? 'wait not done' : `wait done ${mmss(run.dur)}`, peakLabel: `${peak} at once` };

    return {
      notReady: false, ready: true, cvRef: this.cvRef, tipRef: this.tipRef, zoomRef: this.zoomRef,
      head, stats, runs, bars, lanes, ticks, clock, groups, claims, card, hop, key, wallMsg,
      listOn: !fT,
      leftHead: fT ? 'Following one reader' : 'Readers — hover to trace · click to follow',
      rightHead: fT ? 'Claims — click to fly to the line' : 'On the wall',
      wallAria: `The wall: ${W.cols.length} files of ${run.repo} at true line scale with every reader's hops stitched in. Scroll or drag to pan, Command-scroll or pinch to zoom, double-click to dive, plus and minus to zoom, F to fit, Z to fold, bracket keys to change reader, arrow keys to walk hops.`,
      zoomIn: () => this.zoomBtn(1.8), zoomOut: () => this.zoomBtn(1 / 1.8), fitAll: () => this.fitAll(), toggleFold: () => this.toggleFold(),
      foldLabel: S.fold ? 'Unfold' : 'Fold', foldPressed: S.fold ? 'true' : 'false', foldBorder: S.fold ? '#FFB454' : '#3A4677', foldColor: S.fold ? '#FFB454' : '#E8E6DF',
      play: () => this.togglePlay(),
      clear: () => this.clearAll(),
      playing,
      playLabel: playing ? 'Stop the replay' : 'Replay the run',
      playAria: playing ? 'Stop the replay' : 'Replay the run on its own clock',
      playIcon: playing ? 'M1 1h4v10H1zM7 1h4v10H7z' : 'M1 0.5L11 6L1 11.5z',
      hasSel: !!fT || S.selQ !== undefined,
    };
  }
}
DC.register("wall", Component);
})();
</script>
