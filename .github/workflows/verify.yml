name: Verify

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linked-worktree-fence:
    name: Linked-worktree isolated fence
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Initialize engine-sync source for the fence
        run: git submodule update --init -- plugins/engine-sync

      - name: Create a clean linked worktree
        shell: bash
        run: git worktree add --detach "$RUNNER_TEMP/professor-fence" HEAD

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: pfm/go.mod
          cache-dependency-path: pfm/go.sum

      # engine-sync writes the mirrors below, and the fence builds its own
      # copy from the same checked-out source (infra/fence/fence-env.sh).
      # The action stages the shipped machine policy and exports its config
      # home; the fence stages the same file from the same commit for its
      # checks (infra/fence/checks.sh checks_engine_sync_policy), so runner
      # generation and fence checks resolve the same policy.
      - name: Build engine-sync
        uses: ./.github/actions/engine-sync

      # Generated mirrors (AGENTS.md, .codex/**, .opencode/**) are never
      # tracked — the fence worktree starts with none of them, and the
      # roster/marker/opencode gates the fence runs below read them from
      # disk. The fence mounts /worktree read-only by law (files are edited
      # on the HOST, the container only builds and tests), so generation
      # happens here, on the runner, before the fence ever starts.
      - name: Generate Codex and OpenCode mirrors on the host
        shell: bash
        run: |
          set -euo pipefail
          "$ENGINE_SYNC_BIN" build "$RUNNER_TEMP/professor-fence"

      # Structural checks need no repository secret and always run, including forks.
      - name: Stage structural leak-check policy
        shell: bash
        run: |
          set -euo pipefail
          printf '!structural-only\n' > "$RUNNER_TEMP/professor-fence/scripts/leak-terms.txt"

      - name: Stage private leak-check policy (trusted events only)
        if: ${{ github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        env:
          PFM_PRIVATE_LEAK_TERMS: ${{ secrets.PFM_PRIVATE_LEAK_TERMS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PFM_PRIVATE_LEAK_TERMS" || { echo "Missing repository secret PFM_PRIVATE_LEAK_TERMS" >&2; exit 1; }
          umask 077
          printf '%s\n' "$PFM_PRIVATE_LEAK_TERMS" > "$RUNNER_TEMP/professor-leak-terms-private.txt"

      - name: Report skipped private leak coverage
        if: ${{ !(github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) }}
        shell: bash
        run: |
          echo '::warning::PRIVATE COVERAGE SKIPPED — fork or Dependabot PR has no ordinary Actions private leak-term secret; structural checks still run.'
          echo 'PRIVATE COVERAGE SKIPPED — fork or Dependabot PR; structural checks still run.' >> "$GITHUB_STEP_SUMMARY"

      - name: Run structural checks through the isolated fence
        shell: bash
        run: |
          LEAK_TERMS="$RUNNER_TEMP/professor-fence/scripts/leak-terms.txt" \
            "$RUNNER_TEMP/professor-fence/.claude/scripts/dev.sh" iso test templates

      - name: Scan private leak terms (trusted events only)
        if: ${{ github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        shell: bash
        run: |
          LEAK_TERMS="$RUNNER_TEMP/professor-leak-terms-private.txt" \
            "$RUNNER_TEMP/professor-fence/.claude/scripts/dev.sh" iso run '
              set -euo pipefail
              paths="$(mktemp)"
              trap '\''rm -f "$paths"'\'' EXIT
              git --git-dir="$PFM_DEV_REPO_GIT_DIR" --work-tree="$PFM_DEV_REPO_WORK_TREE" ls-files -z > "$paths" || {
                echo "Private leak scan FAILED — tracked-file enumeration failed" >&2; exit 1;
              }
              files=()
              while IFS= read -r -d "" path; do files+=("$path"); done < "$paths"
              (( ${#files[@]} > 0 )) || { echo "Private leak scan FAILED — empty tracked-file enumeration" >&2; exit 1; }
              bash scripts/leak-check.sh --files "${files[@]}"
            '

  cross-compile:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: pfm/go.mod
          cache-dependency-path: pfm/go.sum

      # dev.sh owns the cross-platform compile and reproducibility verdict.
      - name: Build and assert a reproducible sha256 (dev.sh build pfm)
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        shell: bash
        run: .claude/scripts/dev.sh build pfm

  verify:
    name: fmt / vet / test / leak-check / codex-markers
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Initialize engine-sync source for the fence
        run: git submodule update --init -- plugins/engine-sync

      # Mirrors `.claude/scripts/dev.sh`'s own derivation: scratch artifacts land
      # outside the checkout at /tmp/<project>, <project> = the checkout
      # directory's basename with any leading dot stripped. Computed once here
      # (the runner's checkout name is not $REPO_ROOT's basename on this host)
      # so the upload-artifact step below references the same path dev.sh wrote.
      - name: Derive the scratch base directory
        run: |
          set -euo pipefail
          name="$(basename "$GITHUB_WORKSPACE")"; name="${name#.}"
          echo "TMP_BASE=/tmp/$name" >> "$GITHUB_ENV"

      - name: Fetch the lint base
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Verify pfm through the isolated fence
        run: .claude/scripts/dev.sh iso verify pfm

      - name: Test pfm through the isolated fence
        run: .claude/scripts/dev.sh iso test pfm

      - name: upload test-timing TSV
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pfm-test-timing
          path: |
            ${{ env.TMP_BASE }}/timing/**/*.tsv
            ${{ env.TMP_BASE }}/timing/**/*.json
            ${{ env.TMP_BASE }}/timing/**/profile/**
          if-no-files-found: warn
          retention-days: 14
