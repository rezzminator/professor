# The isolated dev fence — mounts the ACTIVE worktree at /worktree and behaves as a
# brand-new machine: own HOME, own tmux, no published ports, builds land in the
# container's ~/.local/bin. `dev.sh iso` is the intended entry point; it sets
# PFM_DEV_WORKTREE to the checkout it runs from. See docs/dev/isolated-dev-foundation.md.
services:
  pfm-dev:
    build:
      context: .
      dockerfile: pfm-dev.Dockerfile
      # Named explicitly, never left to stage order: pfm-sim shares this
      # Dockerfile, and a dev lane handed the Chrome image tests the wrong machine.
      target: pfm-dev
      # infra/fence/image-key.sh computes this from the resolved build inputs;
      # an ordinary builder leaves an unkeyed image for the next fence start.
      labels:
        pfm.fence.inputs: ${PFM_DEV_INPUTS_KEY:-unkeyed}
    image: professor-pfm-dev
    # A real machine has an init that reaps orphans; a bare container does
    # not, so a double-forked descendant lingers as a zombie and the
    # proc-jailer stress reads "still exists" for a process that is
    # already dead. tini closes that gap.
    init: true
    # A hard memory ceiling: RAM and swap together never exceed 2 GB, so one
    # fence cannot starve the host or the containers beside it. pfm-sim
    # inherits it through extends.
    mem_limit: 2g
    memswap_limit: 2g
    # Fence housekeeping (infra/fence/housekeeping.sh) removes only containers
    # carrying this label: exited ones, and running ones past their age limit
    # unless `iso shell` or the demo also set pfm.fence.long-lived=1.
    labels:
      pfm.fence: "1"
    volumes:
      # Read-only by law: files are edited on the HOST; the container only builds
      # and tests. Build/test outputs land in the cache volumes and container-HOME,
      # never the tree — an in-container write to /worktree fails loudly.
      - ${PFM_DEV_WORKTREE:?set by dev.sh iso — the worktree to fence}:/worktree:ro
      # dev.sh resolves the active checkout's common Git directory and mounts it
      # read-only so both main and linked worktrees retain git-backed gates.
      - ${PFM_DEV_GIT_COMMON:?set by dev.sh iso — the common Git directory}:/pfm-git-common:ro
      - pfm-dev-gocache:/root/.cache/go-build
      - pfm-dev-gomod:/root/go/pkg/mod
      - pfm-dev-lintcache:/root/.cache/golangci-lint
    working_dir: /worktree
    environment:
      PFM_DEV_FENCE: "1"
      # root-vs-uid1000 dubious ownership + an unmounted worktree gitdir break `git`-shelling go builds; pfm reports version "dev", so no VCS stamp is lost.
      GOFLAGS: "-buildvcs=false"
      PFM_DEV_REPO_GIT_DIR: /pfm-git-common/${PFM_DEV_GIT_DIR_REL:?set by dev.sh iso — relative active gitdir}
      PFM_DEV_REPO_WORK_TREE: /worktree

  # The real-simulation fence (`dev.sh iso sim`): pfm-dev's mounts and law plus
  # a real Google Chrome and the shared memory Chrome needs
  # (Docker's 64 MB /dev/shm default crashes renderers on heavy pages).
  # sim-entry.sh builds and installs pfm from the fenced
  # worktree, and turns the harvester's browser rung on. dev.sh mounts the
  # harvester state per worktree (pfm-sim-harvest-<key>), so one worktree's
  # provisioned sidecar never flips under another's.
  pfm-sim:
    extends:
      service: pfm-dev
    build:
      target: pfm-sim
    image: professor-pfm-sim
    shm_size: "2gb"
    entrypoint: ["/worktree/infra/fence/sim-entry.sh"]
    environment:
      # uv's cache lives INSIDE the per-worktree harvest volume: one filesystem,
      # so uv hardlinks. Every sidecar-script edit publishes a new environment
      # (the script is in its digest); hardlinked, that costs seconds, where a
      # cross-volume copy would cost the environment's full size per edit.
      UV_CACHE_DIR: /root/.local/state/pfm/harvest-python/.uv-cache

# The caches are shared by bare name with plain `docker run -v` mounters, so
# compose never creates or prefixes them (a compose-made fence_… copy is never
# shared, and a volume compose did not create draws a warning on every run):
# they are external, and dev.sh iso and infra/demo/up.sh create them first
# (fence_volumes_ensure, infra/fence/housekeeping.sh). Bare-name mounters:
#   pfm-dev-gocache    lanes/container.sh, release-rehearsal.sh
#   pfm-dev-gomod      lanes/container.sh, release-rehearsal.sh, host-rehearsal.sh (read-only)
#   pfm-dev-lintcache  docker-compose.yml (pfm-dev, pfm-sim by extends)
#   pfm-lane-harvest-cache  lanes/root.sh (via lanes/container.sh)
#   pfm-lane-uv-cache       lanes/root.sh (via lanes/container.sh)
volumes:
  pfm-dev-gocache:
    external: true
    name: pfm-dev-gocache
  pfm-dev-gomod:
    external: true
    name: pfm-dev-gomod
  pfm-dev-lintcache:
    external: true
    name: pfm-dev-lintcache
