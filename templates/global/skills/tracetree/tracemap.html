<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trace map</title>
<style>
/* Layout: a survey sheet. Field notes on the left (what was asked, what came back, how much of it holds), the code wall
   on the right (every file a hop sits in, drawn to scale from its own text), the run's clock beneath the wall.
   Three voices: serif for what was asked, sans for what the walkers answered, mono for the code that proves it. */
:root {
  --ground: #e8ecea; --sheet: #f7f9f8; --raise: #ffffff; --ink: #14201d; --ink-2: #4c5b57; --ink-3: #7c8a86;
  --rule: #d3dbd8; --code-rgb: 20 32 29; --accent: #0a6c63; --accent-soft: rgba(10, 108, 99, .12); --chip-ink: #ffffff;
  --ok: #1b8459; --moved: #2a62c4; --placed: #b06f00; --followed: #7448cc; --drift: #b0521d; --reject: #c0263a;
  --alarm: #a3172a; --alarm-ink: #fff3f1; --alarm-edge: #5d0a14; --shade: rgba(16, 28, 26, .16);
  --t0: #d1435b; --t1: #1f7fb3; --t2: #c58710; --t3: #2c9152; --t4: #7d4fd0; --t5: #dd672b;
  --t6: #0f9298; --t7: #bd3d91; --t8: #63841a; --t9: #3a5cd6; --t10: #9b5b26; --t11: #4f7894;
  --display: ui-serif, "New York", "Iowan Old Style", Charter, "Palatino Linotype", Georgia, serif;
  --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #090e0f; --sheet: #0e1516; --raise: #141e1f; --ink: #e1e9e6; --ink-2: #97a6a1; --ink-3: #62716d;
    --rule: #1f2d2d; --code-rgb: 214 228 223; --accent: #45cdbd; --accent-soft: rgba(69, 205, 189, .14); --chip-ink: #071010;
    --ok: #3ccb8a; --moved: #6d9fff; --placed: #f1b23c; --followed: #b08cff; --drift: #f18a4c; --reject: #ff5c6c;
    --alarm: #4a0a14; --alarm-ink: #ffe0dc; --alarm-edge: #ff5c6c; --shade: rgba(0, 0, 0, .5);
    --t0: #ff6f86; --t1: #55c3ff; --t2: #ffc65a; --t3: #5fdc8c; --t4: #b28bff; --t5: #ff9460;
    --t6: #3fd4d0; --t7: #f56fc6; --t8: #b8d641; --t9: #7f9cff; --t10: #e2a36d; --t11: #8fb6cf;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #090e0f; --sheet: #0e1516; --raise: #141e1f; --ink: #e1e9e6; --ink-2: #97a6a1; --ink-3: #62716d;
  --rule: #1f2d2d; --code-rgb: 214 228 223; --accent: #45cdbd; --accent-soft: rgba(69, 205, 189, .14); --chip-ink: #071010;
  --ok: #3ccb8a; --moved: #6d9fff; --placed: #f1b23c; --followed: #b08cff; --drift: #f18a4c; --reject: #ff5c6c;
  --alarm: #4a0a14; --alarm-ink: #ffe0dc; --alarm-edge: #ff5c6c; --shade: rgba(0, 0, 0, .5);
  --t0: #ff6f86; --t1: #55c3ff; --t2: #ffc65a; --t3: #5fdc8c; --t4: #b28bff; --t5: #ff9460;
  --t6: #3fd4d0; --t7: #f56fc6; --t8: #b8d641; --t9: #7f9cff; --t10: #e2a36d; --t11: #8fb6cf;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
code { font-family: var(--mono); font-size: .86em; padding: 0 .25em; border-radius: 3px; background: rgb(var(--code-rgb) / .07); overflow-wrap: anywhere; }

#app { display: grid; grid-template-columns: minmax(320px, 430px) minmax(0, 1fr); height: 100%; }

/* ---------- the ledger ---------- */
#ledger { min-height: 0; overflow-y: auto; background: var(--sheet); border-right: 1px solid var(--rule);
  padding: 26px 28px 40px; display: flex; flex-direction: column; gap: 28px; scrollbar-width: thin; }
.eyebrow { display: flex; align-items: center; gap: 9px; font: 600 10.5px/1.3 var(--mono); letter-spacing: .14em;
  text-transform: uppercase; color: var(--ink-3); }
.eyebrow svg { flex: none; }
.mast h1 { font: 500 40px/1.04 var(--display); letter-spacing: -.012em; margin: 10px 0 8px; text-wrap: balance; overflow-wrap: anywhere; }
.root { font: 11.5px/1.5 var(--mono); color: var(--ink-3); overflow-wrap: anywhere; }
.facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: 18px; border-block: 1px solid var(--rule); }
.fact { padding: 10px 0 9px; min-width: 0; }
.fact + .fact { border-left: 1px solid var(--rule); padding-left: 12px; }
.fact b { display: block; font: 600 22px/1.15 var(--sans); font-variant-numeric: tabular-nums; letter-spacing: -.015em; }
.fact span { font: 600 10px/1.3 var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.stamp { margin-top: 10px; font: 11.5px/1.5 var(--mono); color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 2px 16px; }
.stamp em { font-style: normal; color: var(--ink-3); }

#warnings { margin: -6px 0 0; padding: 14px 16px 10px; background: var(--alarm); color: var(--alarm-ink);
  border-left: 4px solid var(--alarm-edge); border-radius: 3px; font: 12px/1.5 var(--mono); }
#warnings p { margin: 0 0 7px; overflow-wrap: anywhere; }
#warnings p:first-child { font: 650 13.5px/1.4 var(--sans); margin-bottom: 10px; }

.sec h2 { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin: 0 0 12px;
  font: 600 10.5px/1.3 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
.sec h2 small { font: 11px var(--mono); letter-spacing: 0; text-transform: none; }
.verdict { margin: 0 0 12px; font: 500 15px/1.45 var(--sans); text-wrap: pretty; }
.verdict .warn { color: var(--drift); }
.verdict .bad { color: var(--reject); }
.bar { display: flex; gap: 2px; height: 10px; }
.bar i { display: block; min-width: 3px; border-radius: 1px; }
.legend { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px 14px; margin-top: 12px; font-size: 12px; color: var(--ink-2); }
.legend div { display: flex; align-items: baseline; gap: 7px; min-width: 0; }
.legend .sw { width: 8px; height: 8px; border-radius: 1px; flex: none; transform: translateY(-1px); }
.legend b { font: 600 12.5px var(--sans); font-variant-numeric: tabular-nums; color: var(--ink); }
.legend .zero { opacity: .42; }
.tally { margin-top: 14px; font: 12px/1.5 var(--sans); color: var(--ink-2); }
.tally b { font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.tally .bad { color: var(--reject); }
details.counts { margin-top: 10px; }
details.counts summary { cursor: pointer; font: 11px var(--mono); color: var(--ink-3); list-style: none; }
details.counts summary::-webkit-details-marker { display: none; }
details.counts summary::before { content: "+ "; }
details.counts[open] summary::before { content: "− "; }
details.counts p { margin: 6px 0 0; font: 11px/1.6 var(--mono); color: var(--ink-3); overflow-wrap: anywhere; }

.q { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 0 12px; padding: 18px 0 14px; border-top: 1px solid var(--rule); }
.q:first-of-type { border-top: 0; padding-top: 2px; }
.q .num { font: 500 21px/1.15 var(--display); color: var(--ink-3); font-variant-numeric: lining-nums; }
.ask { margin: 0; font: 15.5px/1.5 var(--display); color: var(--ink); text-wrap: pretty; }
.ask.clamp { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.more { border: 0; background: none; padding: 2px 0 0; font: 11.5px var(--mono); color: var(--accent); }
.none { margin: 8px 0 0; font: 12.5px/1.5 var(--sans); color: var(--ink-3); }
.thread { margin-top: 12px; }
.thead { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 9px; align-items: start; width: calc(100% + 16px);
  margin: 0 -8px; padding: 7px 8px; border: 0; border-radius: 6px; background: none; text-align: left; }
.thead:hover, .thread.on > .thead { background: rgb(var(--code-rgb) / .06); }
.thread.on > .thead { box-shadow: inset 2px 0 var(--tc); }
.tid { display: inline-grid; place-items: center; min-width: 24px; height: 19px; padding: 0 6px; border-radius: 10px;
  font: 650 11px/1 var(--mono); color: var(--chip-ink); background: var(--tc); }
.tbody { display: block; min-width: 0; }
.tline { font: 13px/1.45 var(--sans); color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.tmeta { display: flex; flex-wrap: wrap; gap: 2px 12px; margin-top: 3px; font: 11px/1.5 var(--mono); color: var(--ink-3); }
.tmeta .warn { color: var(--placed); }
.tmeta .bad { color: var(--reject); }
.answers { list-style: none; margin: 6px 0 0; padding: 0; }
.answers li { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 7px; padding: 5px 0; font: 13px/1.55 var(--sans); }
.answers li + li { border-top: 1px dashed rgb(var(--code-rgb) / .1); }
.mk { font: 650 12px/1.6 var(--mono); text-align: center; }
.mk.ok { color: var(--ok); } .mk.moved { color: var(--moved); } .mk.drift { color: var(--drift); } .mk.bad { color: var(--reject); }
.cite { display: inline; padding: 1px 5px; border: 1px solid var(--rule); border-radius: 4px; background: var(--raise);
  font: 11px/1.4 var(--mono); color: var(--ink-2); white-space: nowrap; }
.cite:hover { border-color: var(--accent); color: var(--accent); }
.flag { display: block; margin-top: 2px; font: 11px/1.45 var(--mono); color: var(--reject); overflow-wrap: anywhere; }
.flag.moved { color: var(--moved); }
.flag.drift { color: var(--drift); }
.left-open { list-style: none; margin: 8px 0 0; padding: 0; font: 11.5px/1.5 var(--mono); color: var(--ink-3); }
.left-open li { padding: 2px 0 2px 14px; text-indent: -14px; overflow-wrap: anywhere; }
.kids { margin: 4px 0 0 10px; padding-left: 12px; border-left: 1px solid var(--rule); }
.missing-node { margin-top: 10px; font: 12px/1.5 var(--mono); color: var(--reject); }

.key { font-size: 12px; color: var(--ink-2); border-top: 1px solid var(--rule); padding-top: 18px; }
.key dl { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 8px 10px; margin: 0; align-items: center; }
.key dt { display: grid; place-items: center; }
.key dd { margin: 0; }
.key p { margin: 14px 0 0; color: var(--ink-3); font-size: 11.5px; line-height: 1.55; }
.key kbd { font: 10.5px var(--mono); padding: 0 4px; border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 3px; background: var(--raise); }

/* ---------- the field: wall, tools, inspector, clock ---------- */
#field { position: relative; display: grid; grid-template-rows: minmax(0, 1fr) auto; min-width: 0; min-height: 0; }
#wall { position: relative; min-height: 0; overflow: hidden; }
#stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#stage.panning { cursor: grabbing; }
#stage.point { cursor: pointer; }
#empty { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--ink-3); font: 15px/1.5 var(--display); }

.dock { position: absolute; bottom: 12px; z-index: 3; display: flex; align-items: center; gap: 8px; max-width: calc(100% - 24px); }
#play-dock { left: 12px; }
#view-dock { right: 12px; }
#wall.tight #view-dock { bottom: 52px; }
#wall.tight #search { width: 120px; }
#wall.tight #ticker { bottom: 80px; }
.group { display: flex; align-items: center; height: 32px; background: var(--raise); border: 1px solid var(--rule); border-radius: 8px;
  box-shadow: 0 1px 2px var(--shade); overflow: hidden; }
.tb { height: 100%; padding: 0 11px; border: 0; background: none; display: inline-flex; align-items: center; gap: 6px;
  font: 500 12.5px var(--sans); color: var(--ink-2); white-space: nowrap; }
.tb + .tb, .tb + input, input + .tb { border-left: 1px solid var(--rule); }
.tb:hover { color: var(--ink); background: rgb(var(--code-rgb) / .04); }
.tb[aria-pressed="true"] { color: var(--accent); }
.tb.play { color: var(--accent); font-weight: 650; padding-inline: 12px 13px; }
.tb svg { flex: none; }
#search { width: 190px; height: 100%; border: 0; background: none; padding: 0 10px; outline: none; font: 12px var(--mono); }
#hits { font: 11px var(--mono); color: var(--ink-3); padding: 0 10px 0 2px; white-space: nowrap; }
#ticker { position: absolute; left: 0; bottom: 40px; width: max-content; max-width: min(620px, calc(100vw - 24px)); padding: 0 12px; height: 32px; display: flex; align-items: center; gap: 9px; background: var(--raise);
  border: 1px solid var(--rule); border-radius: 8px; box-shadow: 0 1px 2px var(--shade); font: 11.5px var(--mono); color: var(--ink-2); }
#ticker .clockface { color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; flex: none; }
#ticker .what { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

#tip { position: absolute; z-index: 5; pointer-events: none; max-width: 380px; padding: 9px 11px; background: var(--raise);
  border: 1px solid var(--rule); border-radius: 8px; box-shadow: 0 8px 24px -8px var(--shade); font-size: 12px; }
#tip .h { display: flex; gap: 8px; align-items: center; font: 11.5px var(--mono); color: var(--ink-2); }
#tip pre { margin: 6px 0 0; font: 11.5px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink); }
#tip p { margin: 5px 0 0; color: var(--ink-2); line-height: 1.45; }

#inspector { position: absolute; top: 12px; right: 12px; bottom: 56px; z-index: 4; width: min(420px, calc(100% - 24px));
  display: flex; flex-direction: column; background: var(--raise); border: 1px solid var(--rule); border-radius: 10px;
  box-shadow: 0 18px 40px -18px var(--shade); overflow: hidden; }
.ins-head { padding: 14px 44px 12px 16px; border-bottom: 1px solid var(--rule); position: relative; }
.ins-head .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font: 11.5px var(--mono); color: var(--ink-3); }
.ins-head h3 { margin: 7px 0 0; font: 600 15px/1.35 var(--sans); overflow-wrap: anywhere; }
.ins-head h3.brief { font: 400 13.5px/1.5 var(--sans); color: var(--ink); max-height: 9.2em; overflow: auto; }
.x { position: absolute; top: 9px; right: 9px; width: 28px; height: 28px; border: 0; border-radius: 6px; background: none; color: var(--ink-3); font-size: 18px; line-height: 1; }
.x:hover { background: rgb(var(--code-rgb) / .07); color: var(--ink); }
.ins-body { overflow: auto; padding: 12px 16px 18px; display: flex; flex-direction: column; gap: 14px; scrollbar-width: thin; }
.addr { display: flex; align-items: center; gap: 8px; font: 12px var(--mono); overflow-wrap: anywhere; }
.copy { flex: none; border: 1px solid var(--rule); background: none; border-radius: 5px; padding: 1px 7px; font: 11px var(--mono); color: var(--ink-3); }
.copy:hover { color: var(--accent); border-color: var(--accent); }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 10px; font: 600 10.5px/1.6 var(--mono);
  letter-spacing: .04em; text-transform: uppercase; border: 1px solid currentColor; }
.pill.verified { color: var(--ok); } .pill.moved { color: var(--moved); } .pill.placed { color: var(--placed); }
.pill.followed { color: var(--followed); } .pill.drifted { color: var(--drift); } .pill.rejected, .pill.badaddr { color: var(--reject); }
.codebox { margin: 0; border: 1px solid var(--rule); border-radius: 7px; background: rgb(var(--code-rgb) / .035); overflow-x: auto;
  padding: 6px 0; font: 11.5px/1.65 var(--mono); tab-size: 4; }
.codebox div { display: grid; grid-template-columns: 46px max-content; min-width: 100%; }
.codebox div.hit { background: color-mix(in srgb, var(--tc) 15%, transparent); box-shadow: inset 3px 0 var(--tc); }
.codebox div.at { background: var(--accent-soft); box-shadow: inset 3px 0 var(--accent); }
.codebox .n { color: var(--ink-3); text-align: right; padding-right: 12px; user-select: none; }
.codebox .t { white-space: pre; padding-right: 14px; }
.codebox .gap { color: var(--ink-3); font-style: normal; padding-left: 58px; display: block; }
.note { margin: 0; font: 13.5px/1.55 var(--sans); color: var(--ink); }
.note b { display: block; font: 600 10px/1.4 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 2px; }
.flagline { font: 11.5px/1.5 var(--mono); color: var(--placed); overflow-wrap: anywhere; }
.nav { display: flex; gap: 8px; }
.nav button, .linkbtn { border: 1px solid var(--rule); background: none; border-radius: 6px; padding: 4px 10px; font: 12px var(--sans); color: var(--ink-2); }
.nav button:hover:not(:disabled), .linkbtn:hover { color: var(--accent); border-color: var(--accent); }
.nav button:disabled { opacity: .4; cursor: default; }
.walk { list-style: none; margin: 0; padding: 0; counter-reset: hop; }
.walk li button { display: grid; grid-template-columns: 26px minmax(0, 1fr) 8px; gap: 8px; align-items: baseline; width: 100%; padding: 6px 4px;
  border: 0; border-top: 1px solid var(--rule); background: none; text-align: left; }
.walk li button:hover { background: rgb(var(--code-rgb) / .05); }
.walk .i { font: 11px var(--mono); color: var(--ink-3); text-align: right; }
.walk .w { min-width: 0; }
.walk .w span { display: block; font: 11.5px var(--mono); color: var(--ink-2); }
.walk .w code { display: block; background: none; padding: 0; font-size: 11.5px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.walk .d { width: 7px; height: 7px; border-radius: 50%; }
.minihead { font: 600 10px/1.4 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 6px; }
.complist { list-style: none; margin: 0; padding: 0; font: 12px/1.6 var(--mono); }
.complist li { display: flex; justify-content: space-between; gap: 10px; border-top: 1px solid var(--rule); padding: 4px 0; }
.complist li span:last-child { color: var(--ink-3); }

#clock { position: relative; background: var(--sheet); border-top: 1px solid var(--rule); padding: 10px 0 4px; }
#clock[hidden] { display: none !important; }
#clock .title { position: absolute; top: 9px; left: 16px; font: 600 10px/1.3 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); pointer-events: none; }
#clocksvg { display: block; width: 100%; touch-action: none; cursor: ew-resize; user-select: none; }
#clocksvg text { font: 10.5px var(--mono); fill: var(--ink-3); }
#clocksvg .rowlab { cursor: pointer; }
#clocksvg .rowlab.on text { fill: var(--ink); font-weight: 650; }
#clocksvg .bar { cursor: pointer; }

@media (max-width: 860px) {
  html, body { height: auto; }
  body { background: var(--sheet); }
  #app { display: flex; flex-direction: column; gap: 26px; height: auto; padding-block: 22px 32px; }
  #ledger { display: contents; }
  #ledger > * { margin-inline: 16px; }
  .mast { order: 1; } #warnings { order: 2; margin-top: 0; } #evidence { order: 3; }
  #field { order: 4; height: min(84vh, 760px); border-block: 1px solid var(--rule); }
  #asked { order: 5; } #key { order: 6; }
  .mast h1 { font-size: 34px; }
  #inspector { top: auto; left: 8px; right: 8px; bottom: 52px; width: auto; height: 58%; }
  #search { width: 120px; }
  .legend { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  #play-dock { max-width: calc(100% - 24px); }
  #view-dock { bottom: 52px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div id="app">
  <aside id="ledger" aria-label="Run ledger">
    <header class="mast">
      <div class="eyebrow">
        <svg width="22" height="16" viewBox="0 0 22 16" aria-hidden="true"><rect x="1" y="1" width="4" height="14" rx="1" fill="currentColor" opacity=".35"/><rect x="9" y="1" width="4" height="9" rx="1" fill="currentColor" opacity=".35"/><rect x="17" y="1" width="4" height="12" rx="1" fill="currentColor" opacity=".35"/><rect x="1" y="9" width="4" height="2" fill="var(--t0)"/><rect x="9" y="4" width="4" height="2" fill="var(--t1)"/><rect x="17" y="7" width="4" height="2" fill="var(--t0)"/><path d="M5 10 C 7 10, 7 5, 9 5" fill="none" stroke="var(--t1)" stroke-width="1"/></svg>
        <span id="eyebrow">Trace run</span>
      </div>
      <h1 id="title">Trace map</h1>
      <div class="root" id="root"></div>
      <div class="facts" id="facts"></div>
      <div class="stamp" id="stamp"></div>
    </header>
    <!--TRACEMAP_WARNINGS-->

    g.addEventListener("mouseenter", () => { if (!S.focus && !S.hop) { S.hoverT = r.t; dirty = true; wake(); drawClockHead(); } });
    g.addEventListener("mouseleave", () => { if (!S.focus && !S.hop) { S.hoverT = null; dirty = true; wake(); } });
    lab.addEventListener("click", () => selectThread(r.t, true));
    if (x.end && rh >= 11) { const e = sv("rect", { x: x1 + 3, y: y + rh / 2 - 2.5, width: 5, height: 5, fill: c, opacity: on ? 1 : 0.3 }, clockSvg); sv("title", {}, e).textContent = `END ${x.end.kind}`; }
  });
  drawClockHead();
}
let headEl = null;
function drawClockHead() {
  if (!clockGeo) return;
  if (headEl) headEl.remove();
  headEl = null;
  if (S.tau == null) return;
  const x = clockGeo.X(S.tau), h = Number(clockSvg.getAttribute("height"));
  headEl = sv("g", { "pointer-events": "none" }, clockSvg);
  sv("line", { x1: x, x2: x, y1: 4, y2: h - 22, stroke: TOK.accent, "stroke-width": 1.5 }, headEl);
  sv("circle", { cx: x, cy: 4, r: 3.5, fill: TOK.accent }, headEl);
}
let scrub = null;
clockSvg.addEventListener("pointerdown", (ev) => {
  if (!clockGeo || ev.target.closest(".bar, .rowlab")) return;
  scrub = true; clockSvg.setPointerCapture(ev.pointerId); scrubTo(ev);
});
clockSvg.addEventListener("pointermove", (ev) => { if (scrub) scrubTo(ev); });
clockSvg.addEventListener("pointerup", () => { scrub = null; });
clockSvg.addEventListener("dblclick", () => { stopPlay(true); });
function scrubTo(ev) {
  const r = clockSvg.getBoundingClientRect(), px = ((ev.clientX - r.left) / r.width) * clockGeo.w;
  S.tau = clamp(t0 + ((px - clockGeo.left) / (clockGeo.w - clockGeo.left - clockGeo.right)) * span, t0, tEnd);
  S.playing = false; setPlayUI();
  updateTicker(); drawClockHead(); dirty = true; wake();
}

// ---------------------------------------------------------------- replay
const REPLAY_MS = 22000;
const speeds = [1, 2, 4, 0.5];
$("#speed").addEventListener("click", (ev) => { S.speed = speeds[(speeds.indexOf(S.speed) + 1) % speeds.length]; ev.currentTarget.textContent = `${S.speed}×`; });
function setPlayUI() {
  $("#playlabel").textContent = S.playing ? "Pause" : S.tau != null && S.tau < tEnd ? "Resume" : "Replay run";
  $("#playicon").setAttribute("d", S.playing ? "M1 1 H4 V11 H1 Z M6 1 H9 V11 H6 Z" : "M1 1 L9 6 L1 11 Z");
  $("#ticker").hidden = S.tau == null;
}
function togglePlay() {
  if (S.playing) { S.playing = false; setPlayUI(); return; }
  if (S.tau == null || S.tau >= tEnd) S.tau = t0;
  S.playing = true; lastFrame = performance.now(); setPlayUI(); wake();
}
function stopPlay(showAll) {
  S.playing = false;
  if (showAll) S.tau = null;
  setPlayUI(); drawClockHead(); dirty = true; wake();
}
$("#play").addEventListener("click", togglePlay);
function updateTicker() {
  if (S.tau == null) return;
  $("#clockface").textContent = `${dur(S.tau - t0)} / ${dur(span)}`;
  let latest = null;
  for (const s of allSteps) if (s.time <= S.tau && (!latest || s.time > latest.time)) latest = s;
  const what = $("#what");
  put(what);
  if (latest) what.append(chipEl(latest.t), ` ${baseOf(latest.file)}:${latest.line}  `, (lineText(latest.col, latest.line) || "").trim().slice(0, 90));
}

// ---------------------------------------------------------------- search
const search = $("#search"), hitsEl = $("#hits");
search.addEventListener("input", () => {
  const q = search.value;
  S.query = q; S.hits = []; S.hitI = -1;
  if (q.trim().length >= 2) {
    const needle = q.toLowerCase();
    for (const col of cols) {
      for (let n = 1; n <= col.count && S.hits.length < 5000; n++) { const t = lineText(col, n); if (t && t.toLowerCase().includes(needle)) S.hits.push({ col, n }); }
    }
  }
  hitsEl.hidden = !S.hits.length && q.trim().length < 2;
  hitsEl.textContent = q.trim().length < 2 ? "" : S.hits.length ? `${S.hits.length}${S.hits.length >= 5000 ? "+" : ""}` : "none";
  dirty = true; wake();
});
search.addEventListener("keydown", (ev) => {
  if (ev.key === "Enter" && S.hits.length) {
    S.hitI = (S.hitI + (ev.shiftKey ? -1 : 1) + S.hits.length) % S.hits.length;
    const h = S.hits[S.hitI];
    hitsEl.textContent = `${S.hitI + 1}/${S.hits.length}`;
    selectLine(h.col, h.n, true);
  } else if (ev.key === "Escape") { search.value = ""; search.dispatchEvent(new Event("input")); search.blur(); }
});

// ---------------------------------------------------------------- tools and keys
$("#fit").addEventListener("click", () => { fitView(true); wake(); });
function zoomPoint() {
  const inside = (x, y) => x > 0 && x < W - insetRight() && y > LABELZ && y < H;
  // zoom about the left edge of the selected line, so its gutter and line numbers stay on screen
  if (S.hop) { const B = stepBox(S.hop), x = Math.max(B.x, 1); if (inside(x, B.ym)) return [x, B.ym]; }
  if (S.line) { const x = Math.max(colSX(S.line.col), 1), y = SY(yWorld(S.line.col, S.line.n + 0.5)); if (inside(x, y)) return [x, y]; }
  return [(W - insetRight()) / 2, H / 2];
}
$("#zoomin").addEventListener("click", () => zoomAt(...zoomPoint(), 1.6));
$("#zoomout").addEventListener("click", () => zoomAt(...zoomPoint(), 1 / 1.6));
let foldAnim = null;
function setFold(on) {
  S.mTo = on ? 1 : 0;
  $("#fold").setAttribute("aria-pressed", String(on));
  const anchorStep = S.hop || null, from = S.m, start = performance.now(), dt = reduced ? 1 : 520;
  const keep = anchorStep ? stepBox(anchorStep).ym : null, v0 = { ...view };
  S.m = S.mTo; fitView(false);
  const v1 = { ...view };
  S.m = from; Object.assign(view, v0); layoutPieces();
  foldAnim = (now) => {
    const u = clamp((now - start) / dt, 0, 1), e = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
    S.m = lerp(from, S.mTo, e);
    if (anchorStep) { layoutPieces(); view.y += keep - stepBox(anchorStep).ym; }
    else { view.k = v0.k * Math.pow(v1.k / v0.k, e); view.x = lerp(v0.x, v1.x, e); view.y = lerp(v0.y, v1.y, e); }
    if (u >= 1) foldAnim = null;
  };
  wake();
}
$("#fold").addEventListener("click", () => setFold(S.mTo === 0));
const themes = ["", "light", "dark"];
let theme = 0;
try { theme = Math.max(0, themes.indexOf(localStorage.getItem("tracemap-theme") || "")); } catch (e) { theme = 0; }
function applyTheme() {
  if (themes[theme]) document.documentElement.dataset.theme = themes[theme]; else delete document.documentElement.dataset.theme;
  $("#theme").title = `Theme: ${themes[theme] || "system"}`;
  readTokens(); drawClock(); dirty = true; wake();
}
$("#theme").addEventListener("click", () => {
  theme = (theme + 1) % 3;
  try { localStorage.setItem("tracemap-theme", themes[theme]); } catch (e) { /* a private window keeps the theme for this visit */ }
  applyTheme();
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (!themes[theme]) applyTheme(); });

addEventListener("keydown", (ev) => {
  if (ev.target === search || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const k = ev.key;
  if (k === "/") { ev.preventDefault(); search.focus(); }
  else if (k === "Escape") { if (S.playing || S.tau != null) stopPlay(true); else clearSel(); }
  else if (k === " ") { ev.preventDefault(); togglePlay(); }
  else if (k === "f") { fitView(true); wake(); }
  else if (k === "z") setFold(S.mTo === 0);
  else if (k === "+" || k === "=") zoomAt(...zoomPoint(), 1.5);
  else if (k === "-" || k === "_") zoomAt(...zoomPoint(), 1 / 1.5);
  else if (k === "ArrowRight" || k === "ArrowLeft") {
    const d = k === "ArrowRight" ? 1 : -1;
    if (S.hop) { const st = TH.get(S.hop.t).steps, n = st[S.hop.j + d]; if (n) { ev.preventDefault(); selectHop(n, true); } }
    else if (S.focus && TH.get(S.focus).steps.length) { ev.preventDefault(); const st = TH.get(S.focus).steps; selectHop(d > 0 ? st[0] : st[st.length - 1], true); }
  } else if (k === "]" || k === "[") {
    const list = tids.filter((t) => TH.get(t).steps.length);
    if (!list.length) return;
    const cur = list.indexOf(S.hop ? S.hop.t : S.focus);
    selectThread(list[(cur + (k === "]" ? 1 : -1) + list.length) % list.length], true);
  }
});

// ---------------------------------------------------------------- frame loop
let raf = 0, lastFrame = performance.now();
function wake() { if (!raf) raf = requestAnimationFrame(frame); }
function frame(now) {
  raf = 0;
  if (foldAnim) { foldAnim(now); dirty = true; }
  if (S.playing) {
    const dt = Math.min(80, now - lastFrame);
    S.tau += (dt / REPLAY_MS) * span * S.speed;
    if (S.tau >= tEnd) { S.tau = tEnd; S.playing = false; setPlayUI(); setTimeout(() => { if (!S.playing && S.tau >= tEnd) stopPlay(true); }, 1400); }
    updateTicker(); drawClockHead(); dirty = true;
  }
  lastFrame = now;
  if (dirty) draw();
  if (foldAnim || S.playing) wake();
}
function resize() {
  const r = wallEl.getBoundingClientRect();
  const first = !W;
  W = Math.max(1, r.width); H = Math.max(1, r.height); dpr = Math.min(3, window.devicePixelRatio || 1);
  stage.width = Math.round(W * dpr); stage.height = Math.round(H * dpr);
  wallEl.classList.toggle("tight", W < 880);
  if (first) { measureLabels(); fitView(false); }
  drawClock(); dirty = true; wake();
}

monoFace = getComputedStyle(document.documentElement).getPropertyValue("--mono").trim() || "monospace";
applyTheme();
if (!cols.length) { const e = $("#empty"); e.hidden = false; e.textContent = "No hop of this run holds in the code, so the wall has nothing to draw."; }
setPlayUI();
new ResizeObserver(resize).observe(wallEl);
new ResizeObserver(() => drawClock()).observe($("#clock"));
resize();
})();
</script>
</body>
</html>
