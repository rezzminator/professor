name: Verify

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linked-worktree-fence:
    name: Linked-worktree isolated fence
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Create a clean linked worktree
        shell: bash
        run: git worktree add --detach "$RUNNER_TEMP/professor-fence" HEAD

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: pfm/go.mod
          cache-dependency-path: pfm/go.sum

      # Generated mirrors (AGENTS.md, .codex/**, .opencode/**) are never
      # tracked — the fence worktree starts with none of them, and the
      # roster/marker/opencode gates the fence runs below read them from
      # disk. The fence mounts /worktree read-only by law (files are edited
      # on the HOST, the container only builds and tests), so generation
      # happens here, on the runner, before the fence ever starts.
      - name: Generate Codex and OpenCode mirrors on the host
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/professor-fence/pfm"
          go run ./cmd/pfm codex build ..
          cd "$RUNNER_TEMP/professor-fence"
          (cd pfm && go run ./cmd/pfm opencode build ..)

      - name: Stage private leak-check policy
        env:
          PFM_PRIVATE_LEAK_TERMS: ${{ secrets.PFM_PRIVATE_LEAK_TERMS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PFM_PRIVATE_LEAK_TERMS" || { echo "Missing repository secret PFM_PRIVATE_LEAK_TERMS" >&2; exit 1; }
          umask 077
          printf '%s\n' "$PFM_PRIVATE_LEAK_TERMS" > "$RUNNER_TEMP/professor-fence/scripts/leak-terms.txt"

      - name: Run the repository gate through the isolated fence
        shell: bash
        run: |
          "$RUNNER_TEMP/professor-fence/.claude/scripts/dev.sh" iso test templates

  cross-compile:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: pfm/go.mod
          cache-dependency-path: pfm/go.sum

      # This matrix is the regression test for the defect that shipped last
      # night: code that builds fine on Linux but breaks on Darwin. pfm ships
      # a real Darwin platform matrix (darwin/arm64 fully supported,
      # darwin/amd64 with a runtime-level pinned-Python lock) — a Darwin-only
      # compile break must fail CI here, not surface after a tag is pushed.
      #
      # Building the SAME target twice with identical flags/env and diffing
      # sha256 doubles as the reproducibility gate: an inherited GOFLAGS once
      # minted a binary that silently diverged from a clean rebuild.
      # `env -u GOFLAGS` refuses to trust whatever the runner happened to
      # have set and pins the flags this step actually asserts.
      - name: Build twice, assert identical sha256 (compile + reproducibility)
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        shell: bash
        run: |
          set -euo pipefail
          out1="$RUNNER_TEMP/pfm_a"
          out2="$RUNNER_TEMP/pfm_b"
          env -u GOFLAGS go -C pfm build -trimpath -ldflags "-X main.version=verify" -o "$out1" ./cmd/pfm
          env -u GOFLAGS go -C pfm build -trimpath -ldflags "-X main.version=verify" -o "$out2" ./cmd/pfm
          sha1="$(sha256sum "$out1" | cut -d' ' -f1)"
          sha2="$(sha256sum "$out2" | cut -d' ' -f1)"
          echo "sha256 = $sha1"
          if [[ "$sha1" != "$sha2" ]]; then
            echo "reproducibility FAILED: $sha1 != $sha2" >&2
            exit 1
          fi

  verify:
    name: fmt / vet / test / leak-check / codex-markers
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: pfm/go.mod
          cache-dependency-path: pfm/go.sum

      # The pinned tools (infra/fence/tools.env) — the same versions the fence image
      # carries, so this job and `dev.sh iso verify pfm` give one verdict.
      - name: pinned tools (golangci-lint, go-test-coverage)
        run: make -C pfm tools

      - name: fmt-check (gofumpt + gci + golines, must report nothing)
        run: make -C pfm fmt-check

      # Judged against origin/main: a release may not add a lint finding on
      # any line it changed. Needs the full history (fetch-depth: 0 above).
      - name: lint-new (golangci-lint, lines changed since main)
        run: git fetch --no-tags origin main:refs/remotes/origin/main && make -C pfm lint-new LINT_BASE=origin/main

      - name: go vet
        run: |
          go -C pfm vet ./...
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go -C pfm vet ./...

      # pfm shells out to an interactive zsh for its terminal actions, and the
      # runner image does not ship one. Install it rather than skipping the
      # test: the developer box has zsh as its login shell, so a skip here
      # would make CI silently weaker than the machine it is meant to protect.
      - name: install zsh (required by the terminal-action tests)
        run: sudo apt-get update && sudo apt-get install -y zsh

      # Every package runs, including the harvester ones. `pfm harvest` ships
      # as beta with open acceptance work (see releases/v0.58.0.md), but its
      # tests PASS today — excluding a passing package buys nothing and makes
      # the run read as broader coverage than it has. If a harvester test ever
      # fails here, fix it or mark it skipped in the package with a reason;
      # never restore a filter at this level, which hides the failure from the
      # one place that reports it.
      #
      # The same fenced entry point owns unit, tagged e2e and timing verdicts.
      - name: timing tool fixtures (fenced)
        run: |
          .claude/scripts/dev.sh iso run 'bash pfm/scripts/test-timing_test.sh && bash pfm/scripts/test-sweep_test.sh'

      - name: pfm suites and timing budgets (fenced)
        run: .claude/scripts/dev.sh iso test pfm

      - name: upload test-timing TSV
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pfm-test-timing
          path: |
            tmp/timing/**/*.tsv
            tmp/timing/**/*.json
          if-no-files-found: warn
          retention-days: 14

      - name: leak-check (secrets / machine-absolute paths, full tracked tree)
        env:
          PFM_PRIVATE_LEAK_TERMS: ${{ secrets.PFM_PRIVATE_LEAK_TERMS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PFM_PRIVATE_LEAK_TERMS" || { echo "Missing repository secret PFM_PRIVATE_LEAK_TERMS" >&2; exit 1; }
          umask 077
          printf '%s\n' "$PFM_PRIVATE_LEAK_TERMS" > scripts/leak-terms.txt
          ./scripts/leak-check.sh --files $(git ls-files)

      - name: codex generated-marker gate
        run: node scripts/check-codex-markers.mjs
