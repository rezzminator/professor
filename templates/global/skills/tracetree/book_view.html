<template id="tpl-book">
<div style="position:relative; width:1680px; height:{{boardH}}px; overflow:hidden; background:#0F1426; color:#E8E6DF; font-family:var(--mono)">
  <sc-if value="{{notReady}}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:12px">
      <div style="font-family:var(--display); font-weight:800; font-size:64px; color:#2A3460">SWATCH BOOK</div>
      <div style="font-size:13px; color:{{loadColor}}">{{loadText}}</div>
    </div>
  </sc-if>
  <sc-if value="{{ready}}" hint-placeholder-val="{{ true }}">
    <div style="position:absolute; left:24px; top:20px; width:1200px; display:flex; flex-direction:column; gap:6px">
      <div class="ell" style="font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:#9AA3C2">Swatch book · {{n}} trace runs under {{root}} · one stitch per hop, one fringe strand per answer</div>
      <h1 style="margin:0; font-family:var(--display); font-weight:800; font-size:44px; line-height:1; color:#F3F1EA">{{title}}</h1>
      <div class="ell" style="font-size:12.5px; color:#C9CED9">{{subtitle}}</div>
    </div>
    <div style="position:absolute; left:1262px; top:18px; width:394px; display:flex; gap:6px">
      <sc-for list="{{sorts}}" as="s" hint-placeholder-count="3">
        <button class="bt" onClick="{{s.pick}}" aria-pressed="{{s.pressed}}" title="{{s.title}}" style="flex:1; min-width:0; height:44px; padding:5px 9px; border-radius:7px; border:1px solid {{s.border}}; background:{{s.bg}}; display:flex; flex-direction:column; justify-content:center">
          <span class="ell" style="font-size:12px; font-weight:600; color:{{s.color}}">{{s.label}}</span>
          <span class="ell" style="font-size:10px; color:#9AA3C2">{{s.sub}}</span>
        </button>
      </sc-for>
    </div>
    <div style="position:absolute; left:24px; top:112px; width:1632px; display:flex; gap:18px; align-items:center; font-size:10.5px; color:#9AA3C2">
      <sc-for list="{{legend}}" as="g" hint-placeholder-count="8">
        <span style="display:flex; align-items:center; gap:6px">
          <svg aria-hidden="true" width="22" height="14"><path d="{{g.d}}" style="fill:none; stroke:{{g.c}}; stroke-width:{{g.w}}; stroke-linecap:round; stroke-dasharray:{{g.dash}}"></path><path d="{{g.d2}}" style="fill:none; stroke:{{g.c2}}; stroke-width:1.8; stroke-linecap:round"></path></svg>{{g.t}}
        </span>
      </sc-for>
      <span style="flex:1"></span>
      <span>yarn = repository · width = hops</span>
    </div>

    <sc-for list="{{cards}}" as="c" hint-placeholder-count="48">
      <div class="card {{c.cls}}" onMouseEnter="{{c.enter}}" onMouseLeave="{{c.leave}}" onClick="{{c.pin}}" title="{{c.title}}" style="position:absolute; left:{{c.l}}px; top:{{c.t}}px; width:196px; height:156px; box-sizing:border-box; border-radius:9px; border:1px solid {{c.border}}; background:{{c.bg}}; opacity:{{c.op}}; animation-delay:{{c.dly}}s; cursor:pointer; overflow:hidden">
        <svg aria-hidden="true" width="196" height="94" style="position:absolute; left:0; top:6px">
          <path d="{{c.cloth}}" style="fill:#131A31; stroke:#262F52; stroke-width:1"></path>
          <path d="{{c.held}}" style="fill:none; stroke:{{c.yarn}}; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round"></path>
          <path d="{{c.mv}}" style="fill:none; stroke:{{c.yarn}}; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round"></path>
          <path d="{{c.mvDot}}" style="fill:none; stroke:#0B0F1E; stroke-width:2; stroke-linecap:round"></path>
          <path d="{{c.pf}}" style="fill:none; stroke:#7FD1FF; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round"></path>
          <path d="{{c.pa}}" style="fill:none; stroke:{{c.yarn}}; stroke-width:1.5; stroke-linecap:round"></path>
          <path d="{{c.paArm}}" style="fill:none; stroke:#F2B33D; stroke-width:1.5; stroke-linecap:round"></path>
          <path d="{{c.dr}}" style="fill:none; stroke:#F2B33D; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:1.2 1.6"></path>
          <path d="{{c.fray}}" style="fill:none; stroke:#F2B33D; stroke-width:0.8; stroke-linecap:round; opacity:0.8"></path>
          <path d="{{c.hole}}" style="fill:#0B0F1E; stroke:#FF5A5F; stroke-width:1.1"></path>
          <path d="{{c.sel}}" style="fill:none; stroke:#FF5A5F; stroke-width:1.4; stroke-linecap:round"></path>
          <path d="{{c.fr0}}" style="fill:none; stroke:#5B6488; stroke-width:1.1; stroke-linecap:round"></path>
          <path d="{{c.fr1}}" style="fill:none; stroke:#7FD1FF; stroke-width:1.2; stroke-linecap:round"></path>
          <path d="{{c.fr2}}" style="fill:none; stroke:#FF8A65; stroke-width:1.3; stroke-linecap:round"></path>
        </svg>
        <div style="position:absolute; left:12px; right:12px; top:97px; display:flex; flex-direction:column; gap:0; line-height:13.5px">
          <span style="display:flex; align-items:baseline; gap:6px">
            <span class="ell" style="flex:1; min-width:0; font-size:12px; font-weight:600; color:{{c.yarn}}">{{c.repo}}</span>
            <sc-if value="{{c.hasTag}}" hint-placeholder-val="{{ false }}">
              <span style="flex:none; font-size:9.5px; padding:1px 5px; border-radius:4px; color:{{c.tagC}}; border:1px solid {{c.tagC}}">{{c.tag}}</span>
            </sc-if>
          </span>
          <span class="ell" style="font-size:10px; color:#9AA3C2">{{c.when}}</span>
          <span class="ell" style="font-size:10px; color:#C9CED9">{{c.stats}}</span>
          <span class="ell" style="font-size:10px; color:{{c.flagC}}">{{c.flags}}</span>
        </div>
      </div>
    </sc-for>

    <sc-if value="{{hasFailed}}" hint-placeholder-val="{{ false }}">
      <div role="alert" aria-label="Runs the kit could not load" style="position:absolute; left:24px; top:{{failTop}}px; width:1632px; display:flex; flex-direction:column; gap:2px; font-size:11px; line-height:14px; color:#FF8A65">
        <div style="font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color:#7D86A8">Runs the kit could not load — listed, not dropped</div>
        <sc-for list="{{failed}}" as="f"><div class="ell" title="{{f.line}}">{{f.line}}</div></sc-for>
      </div>
    </sc-if>
    <div style="position:absolute; left:24px; top:{{detailTop}}px; width:1632px; height:46px; display:flex; align-items:flex-start; gap:14px; font-size:11px; line-height:15px; color:#C9CED9; border-top:1px solid #262F52; padding-top:7px; box-sizing:border-box">
      <span style="flex:none; font-weight:600; color:{{detail.c}}">{{detail.head}}</span>
      <span style="flex:1; min-width:0; color:#AEB6D3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden">{{detail.body}}</span>
      <sc-if value="{{detail.featured}}" hint-placeholder-val="{{ false }}">
        <span style="flex:none; font-size:11.5px; color:#FFB454">{{detail.draw}}</span>
      </sc-if>
    </div>
  </sc-if>
</div>
</template>
<script>
(function () {
const DCLogic = DC.DCLogic;
const YARNS = ['#E8C39E', '#9EC1E8', '#C9A0DC', '#A8D5A2', '#E8A0A0', '#D8D27A', '#8FD3D0', '#E0B0D0', '#B8C4E8', '#D9B48F', '#B5E0C8'];
const CELL = 7, ROWS = 9, CW = 196, CH = 156, GX = 204, GY = 164, X0 = 24, Y0 = 146, PER = 8;
const r1 = (v) => Math.round(v * 10) / 10;
const hash = (s) => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
const rng = (seed) => () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const mmss = (s) => { if (s == null) return '—'; s = Math.round(s); return s >= 60 ? `${Math.floor(s / 60)}m${String(s % 60).padStart(2, '0')}s` : `${s}s`; };
const whenOf = (id) => { const m = /^(\d{4})(\d{2})(\d{2})-(\d{2})(\d{2})/.exec(id); const mon = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; return m ? `${Number(m[3])} ${mon[Number(m[2]) - 1]} ${m[4]}:${m[5]}` : id; };
const pct = (a, b) => (b ? Math.round((100 * a) / b) : 0);
const fmt = (n) => Number(n).toLocaleString('en-US');
const V = (x, y) => `M${r1(x + 1)} ${r1(y + 1.2)}L${r1(x + 3.5)} ${r1(y + 5.8)}L${r1(x + 6)} ${r1(y + 1.2)}`;
const ring = (cx, cy, r) => `M${r1(cx - r)} ${r1(cy)}a${r} ${r} 0 1 0 ${2 * r} 0a${r} ${r} 0 1 0 ${-2 * r} 0`;

// largest-remainder split of `cells` stitches across the hop categories
const allot = (parts, cells) => {
  const total = parts.reduce((s, p) => s + p.n, 0) || 1;
  const raw = parts.map((p) => ({ ...p, q: (p.n * cells) / total }));
  raw.forEach((p) => { p.k = Math.floor(p.q); });
  let left = cells - raw.reduce((s, p) => s + p.k, 0);
  raw.slice().sort((a, b) => (b.q - b.k) - (a.q - a.k)).forEach((p) => { if (left > 0 && p.n > 0) { p.k += 1; left -= 1; } });
  raw.forEach((p) => { if (p.n > 0 && p.k === 0) { const big = raw.reduce((m, x) => (x.k > m.k ? x : m), raw[0]); if (big.k > 1) { big.k -= 1; p.k = 1; } } });
  const out = {};
  raw.forEach((p) => { out[p.id] = p.k; });
  return out;
};

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { data: null, err: null, sort: 'new', hov: null, pin: null, gen: 0 };
    this.cache = {};
  }

  componentDidMount() {
    const el = document.getElementById('book-data');
    const b = el ? JSON.parse(el.textContent) : { root: '', book: [], failed: [] };
    this.setState({ data: { runs: [], book: b.book, failed: b.failed, root: b.root } });
  }

  // one swatch's stitches, deterministic per run id
  weave(b) {
    if (this.cache[b.id]) return this.cache[b.id];
    const cols = Math.max(6, Math.min(24, Math.round(b.hops / ROWS)));
    const cells = cols * ROWS;
    const ver = b.verified, pfN = Math.min(ver, b.placed + b.followed), mvN = Math.min(ver - pfN, b.moved), paN = Math.min(ver - pfN - mvN, b.partial);
    const holeN = Math.max(0, b.hops - b.verified - b.drifted);
    const k = allot([
      { id: 'held', n: ver - pfN - mvN - paN }, { id: 'pf', n: pfN }, { id: 'mv', n: mvN }, { id: 'pa', n: paN },
      { id: 'dr', n: b.drifted }, { id: 'hole', n: holeN },
    ], cells);
    const R = rng(hash(b.id));
    const kind = new Array(cells).fill('held');
    // drift wears through in patches: grow seeded blobs, the way a changed file wears every hop it holds
    let need = k.dr;
    const free = () => kind.map((v, i) => (v === 'held' ? i : -1)).filter((i) => i >= 0);
    while (need > 0) {
      const pool = free();
      if (!pool.length) break;
      const front = [pool[Math.floor(R() * pool.length)]];
      const blob = Math.max(4, Math.ceil(need / (1 + Math.floor(R() * 3))));
      let grown = 0;
      while (front.length && grown < blob && need > 0) {
        const i = front.splice(Math.floor(R() * front.length), 1)[0];
        if (kind[i] !== 'held') continue;
        kind[i] = 'dr'; grown += 1; need -= 1;
        const c = i % cols, r = Math.floor(i / cols);
        [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dc, dr]) => { const cc = c + dc, rr = r + dr; if (cc >= 0 && cc < cols && rr >= 0 && rr < ROWS && kind[rr * cols + cc] === 'held') front.push(rr * cols + cc); });
      }
    }
    ['hole', 'mv', 'pf', 'pa'].forEach((id) => {
      for (let j = 0; j < k[id]; j++) {
        const pool = free();
        if (!pool.length) break;
        kind[pool[Math.floor(R() * pool.length)]] = id;
      }
    });
    const fw = cols * CELL, fx = Math.round((CW - fw) / 2), fy = 4, fh = ROWS * CELL;
    const p = { held: '', mv: '', mvDot: '', pf: '', pa: '', paArm: '', dr: '', fray: '', hole: '' };
    kind.forEach((v, i) => {
      const x = fx + (i % cols) * CELL, y = fy + Math.floor(i / cols) * CELL;
      if (v === 'held') p.held += V(x, y);
      else if (v === 'mv') { p.mv += V(x, y); p.mvDot += `M${r1(x + 3.5)} ${r1(y + 3.4)}h0.01`; }
      else if (v === 'pf') p.pf += V(x, y);
      else if (v === 'pa') { p.pa += `M${r1(x + 1)} ${r1(y + 1.2)}L${r1(x + 3.5)} ${r1(y + 5.8)}`; p.paArm += `M${r1(x + 3.5)} ${r1(y + 5.8)}L${r1(x + 6)} ${r1(y + 1.2)}`; }
      else if (v === 'dr') { p.dr += V(x, y); if (R() < 0.22) p.fray += `M${r1(x + 3.5)} ${r1(y + 5.8)}l${r1((R() - 0.5) * 5)} ${r1(1.5 + R() * 2.5)}`; }
      else p.hole += ring(x + 3.5, y + 3.5, 2.3);
    });
    // structure lines (LEAD / END / SPLIT) with an address past the file: red ticks on the selvage
    const selN = Math.max(0, b.badaddr - holeN);
    let sel = '';
    for (let j = 0; j < Math.min(selN, ROWS); j++) sel += `M${fx + fw + 3} ${r1(fy + 2 + j * CELL)}l4 3`;
    // the fringe: 14 strands, dyed by the share of answers flagged or re-cited
    const slots = 14, ans = b.answers || 1;
    const nf = b.flagged ? Math.max(1, Math.round((slots * b.flagged) / ans)) : 0;
    const nr = Math.min(slots - nf, b.recited ? Math.max(1, Math.round((slots * b.recited) / ans)) : 0);
    const order = Array.from({ length: slots }, (_, j) => j).sort(() => R() - 0.5);
    const fr = ['', '', ''];
    order.forEach((slot, j) => {
      const x = fx + 3 + (slot * (fw - 6)) / (slots - 1), y = fy + fh + 1;
      const kindF = j < nf ? 2 : j < nf + nr ? 1 : 0;
      const len = kindF === 2 ? 14 + R() * 10 : kindF === 1 ? 10 + R() * 5 : 6 + R() * 3;
      const sw = kindF === 2 ? (R() - 0.5) * 9 : (R() - 0.5) * 2;
      fr[kindF] += `M${r1(x)} ${r1(y)}q${r1(sw)} ${r1(len / 2)} ${r1(sw / 2)} ${r1(len)}`;
      if (kindF === 2 && R() < 0.5) fr[kindF] += `M${r1(x + sw / 2)} ${r1(y + len)}l${r1(-2 + R() * 4)} ${r1(2 + R() * 2)}`;
    });
    const out = { ...p, cloth: `M${fx - 2} ${fy - 2}h${fw + 4}v${fh + 4}h${-(fw + 4)}Z`, sel, fr0: fr[0], fr1: fr[1], fr2: fr[2], cols, cells };
    return (this.cache[b.id] = out);
  }

  renderVals() {
    const S = this.state;
    const empty = { notReady: true, ready: false, loadText: S.err ? `The run data could not load — ${S.err}` : 'Loading the book…', loadColor: S.err ? '#FF8A65' : '#9AA3C2',
      sorts: [], legend: [], cards: [], detail: {}, boardH: 400, detailTop: 340, failTop: 300, hasFailed: false, failed: [], root: '' };
    if (!S.data) return empty;
    const book = S.data.book || [];
    const repos = [...new Set(book.map((b) => b.repo))].sort((a, b) => book.filter((x) => x.repo === b).length - book.filter((x) => x.repo === a).length || a.localeCompare(b));
    const yarnOf = (repo) => YARNS[repos.indexOf(repo) % YARNS.length];
    const worn = (b) => (b.hops ? b.drifted / b.hops : 0), fl = (b) => (b.answers ? b.flagged / b.answers : 0);
    const SORTS = {
      new: { label: 'Newest', sub: 'by run time', f: (a, b) => (a.id < b.id ? 1 : -1) },
      worn: { label: 'Most worn', sub: 'drifted / hops', f: (a, b) => worn(b) - worn(a) || (a.id < b.id ? 1 : -1) },
      flag: { label: 'Most flagged', sub: 'flagged / answers', f: (a, b) => fl(b) - fl(a) || (a.id < b.id ? 1 : -1) },
    };
    const list = book.slice().sort(SORTS[S.sort].f);
    const g = S.gen % 2 ? 'b' : 'a';
    const focus = S.pin != null ? S.pin : S.hov;
    const fb = focus != null ? book.find((b) => b.id === focus) : null;

    const cards = list.map((b, i) => {
      const w = this.weave(b), yarn = yarnOf(b.repo), on = !fb || fb.repo === b.repo;
      const tag = !b.live ? ['worktree gone', '#FF8A65'] : b.broke ? ['broke', '#D7263D'] : null;
      return { ...w, l: X0 + (i % PER) * GX, t: Y0 + Math.floor(i / PER) * GY, yarn, repo: b.repo,
        cls: `l${g}`, dly: r1(i * 0.014),
        hasTag: !!tag, tag: tag ? tag[0] : '', tagC: tag ? tag[1] : '#9AA3C2',
        when: `${whenOf(b.id)} · ${b.nodes} readers`,
        stats: `${b.hops} hops · ${pct(b.drifted, b.hops)}% worn`,
        flags: `${b.flagged} of ${b.answers} answers flagged`, flagC: fl(b) >= 0.25 ? '#FF8A65' : '#9AA3C2',
        title: `${b.id} · ${b.repo}\nclick to pin its label`,
        border: S.pin === b.id ? yarn : S.hov === b.id ? '#3A4677' : '#222A4A', bg: S.pin === b.id || S.hov === b.id ? '#1A2140' : '#131A31',
        op: on ? 1 : 0.28,
        enter: () => this.setState({ hov: b.id }), leave: () => { if (this.state.hov === b.id) this.setState({ hov: null }); },
        pin: () => this.setState({ pin: this.state.pin === b.id ? null : b.id }) };
    });

    const sum = (k) => book.reduce((s, b) => s + (b[k] || 0), 0);
    const gone = book.filter((b) => !b.live).length;
    const sorts = Object.entries(SORTS).map(([id, s]) => ({ label: s.label, sub: s.sub, pressed: S.sort === id ? 'true' : 'false', title: `Lay the swatches out ${s.label.toLowerCase()} first`,
      border: S.sort === id ? '#E8E6DF' : '#2E3863', bg: S.sort === id ? '#1E2747' : 'transparent', color: S.sort === id ? '#F3F1EA' : '#C9CED9',
      pick: () => { if (this.state.sort !== id) this.setState({ sort: id, gen: this.state.gen + 1 }); } }));
    const vd = 'M2 3L11 12L20 3';
    const legend = [
      { d: vd, c: '#E8C39E', w: 1.8, dash: 'none', t: 'held' },
      { d: vd, c: '#E8C39E', w: 1.8, dash: 'none', d2: 'M11 6.5h0.01', c2: '#0B0F1E', t: 're-addressed ↻' },
      { d: vd, c: '#7FD1FF', w: 1.8, dash: 'none', t: 'placed / followed' },
      { d: 'M2 3L11 12', c: '#E8C39E', w: 1.8, dash: 'none', d2: 'M11 12L20 3', c2: '#F2B33D', t: 'partly broke' },
      { d: vd, c: '#F2B33D', w: 1.8, dash: '1.6 2', t: 'worn — drifted since the walk' },
      { d: 'M5 7.5a5 5 0 1 0 12 0a5 5 0 1 0 -12 0', c: '#FF5A5F', w: 1.3, dash: 'none', t: 'hole — address gone' },
      { d: 'M8 1v12M14 1v12', c: '#5B6488', w: 1.3, dash: 'none', t: 'fringe: answers' },
      { d: 'M8 1v12', c: '#7FD1FF', w: 1.4, dash: 'none', d2: 'M14 1q3 6 1 12', c2: '#FF8A65', t: 're-cited · flagged' },
    ].map((x) => ({ d2: '', c2: 'none', ...x }));

    let detail;
    if (fb) {
      detail = { c: yarnOf(fb.repo), head: `${fb.repo} · ${fb.id}`, featured: true, draw: `tt map ${S.data.root}/${fb.id} --html OUT`,
        body: [`${fb.nodes} readers on ${fb.q} questions`, mmss(fb.dur),
          `${fb.hops} hops: ` + [[fb.verified, 'held'], [fb.moved, 're-addressed'], [fb.placed, 'placed'], [fb.followed, 'followed'], [fb.partial, 'partly broke'], [fb.drifted, 'worn'], [fb.rejected, 'rejected']].filter(([v]) => v).map(([v, w]) => `${v} ${w}`).join(', '),
          `${fb.answers} answers: ` + ([[fb.flagged, 'flagged'], [fb.recited, 're-cited']].filter(([v]) => v).map(([v, w]) => `${v} ${w}`).join(', ') || 'none flagged'),
          fb.refused ? `${fb.refused} first write${fb.refused === 1 ? '' : 's'} refused` : '', fb.badaddr ? `${fb.badaddr} bad address${fb.badaddr === 1 ? '' : 'es'}` : '',
          `${fb.comps} components, ${fb.edges} links`, fb.live ? '' : 'its worktree is gone, so every hop reads as worn'].filter(Boolean).join(' · ') };
    } else {
      detail = { c: '#9AA3C2', head: 'Hover a swatch to read its label', featured: false, draw: '',
        body: 'a wide swatch walked many hops · amber patches wore through since the walk · a long orange fringe means many answers the kit flagged · hover dims every other repository' };
    }

    const failed = (S.data.failed || []).map((f) => ({ line: `${f.id}  UNREADABLE — ${f.why}` }));
    const gridEnd = Y0 + Math.max(1, Math.ceil(book.length / PER)) * GY, failTop = gridEnd + 6;
    const detailTop = failTop + (failed.length ? 22 + failed.length * 16 : 0) + 8;
    return {
      notReady: false, ready: true, n: book.length + failed.length, root: S.data.root || '', boardH: detailTop + 54, detailTop, failTop,
      hasFailed: failed.length > 0, failed,
      title: `${fmt(sum('hops'))} hops, ${fmt(sum('answers'))} answers, ${book.length} runs`,
      subtitle: `${pct(sum('verified'), sum('hops'))}% of hops held · ${fmt(sum('moved'))} re-addressed · ${fmt(sum('drifted'))} worn · ${fmt(sum('badaddr'))} bad addresses · ${fmt(sum('flagged'))} answers flagged (${pct(sum('flagged'), sum('answers'))}%) · ${fmt(sum('refused'))} first writes refused · ${gone} worktree${gone === 1 ? '' : 's'} gone`,
      sorts, legend, cards, detail,
    };
  }
}
DC.register("book", Component);
})();
</script>
