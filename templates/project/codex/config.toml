# Repo-level Codex config — loads only when this project is trusted in
# ~/.codex/config.toml (Codex asks for trust once, per repo). Scope: sandbox
# reach for executor lanes and for any Codex session started inside this repo.
#
# LANE LAUNCH FLAGS DO NOT BELONG HERE. `-s workspace-write -a never` and the
# rest of the per-launch policy live with the LAUNCHER (the tmux command that
# starts a lane) — this file is also read by the human's interactive sessions,
# and it must never change their defaults out from under them.
#
# This file mirrors a WORKING config: every setting below is one the live
# pipeline actually needs. Before adding anything back that a previous version
# of this template carried, read README.md § "Settings deliberately absent" —
# several of them configured a Codex orchestration model that does not exist.

# ─── Model (adopter choice — keep the shape, pick your own values) ───────────
# The Codex model and reasoning effort this repo defaults to. These are the two
# settings worth pinning per-repo: a lane that silently drops a tier produces
# work that reads finished and is not. See {MODEL_TIER} in CLAUDE.md.
model = "{CODEX_MODEL}"
model_reasoning_effort = "{CODEX_REASONING_EFFORT}"

[sandbox_workspace_write]
# The test tier lives on localhost ({DB_PORT_TEST} / {QUEUE_PORT_TEST}, plus any
# per-pipeline allocated ports) — an executor lane must reach it from INSIDE
# workspace-write or every integration test fails at connect. Unix-socket
# connects (tmux among them) stay blocked by the sandbox regardless of this
# flag, which is why lane pings go through the events.log spool and not tmux.
network_access = true

# ─── MCP servers (OPTIONAL) ───────────────────────────────────────────────
# `pfm codex build` regenerates a `[mcp_servers.*]` block here from `.mcp.json`
# inside a `# BEGIN mcp_servers … # END mcp_servers` fence and never touches
# anything outside it — no `.mcp.json`, no fence, nothing generated. Hand-add
# a table below this comment only for a server that must NOT be driven by
# `.mcp.json`. PIN the version: an unpinned server changes under you between
# sessions, and a protocol that changed shape mid-flight gets blamed on your
# own code first.
#
# [mcp_servers.{server-name}]
# command = "npx"
# args = ["-y", "{npm-package}@{version}"]
