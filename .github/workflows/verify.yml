name: Verify

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linked-worktree-fence:
    name: Linked-worktree isolated fence
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Create a clean linked worktree
        shell: bash
        run: git worktree add --detach "$RUNNER_TEMP/professor-fence" HEAD

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: pfm/go.mod
          cache-dependency-path: pfm/go.sum

      # Generated mirrors (AGENTS.md, .codex/**, .opencode/**) are never
      # tracked — the fence worktree starts with none of them, and the
      # roster/marker/opencode gates the fence runs below read them from
      # disk. The fence mounts /worktree read-only by law (files are edited
      # on the HOST, the container only builds and tests), so generation
      # happens here, on the runner, before the fence ever starts.
      - name: Generate Codex and OpenCode mirrors on the host
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/professor-fence/pfm"
          go run ./cmd/pfm codex build ..
          cd "$RUNNER_TEMP/professor-fence"
          (cd pfm && go run ./cmd/pfm opencode build ..)

      - name: Stage private leak-check policy
        env:
          PFM_PRIVATE_LEAK_TERMS: ${{ secrets.PFM_PRIVATE_LEAK_TERMS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PFM_PRIVATE_LEAK_TERMS" || { echo "Missing repository secret PFM_PRIVATE_LEAK_TERMS" >&2; exit 1; }
          umask 077
          printf '%s\n' "$PFM_PRIVATE_LEAK_TERMS" > "$RUNNER_TEMP/professor-fence/scripts/leak-terms.txt"

      - name: Run the repository gate through the isolated fence
        shell: bash
        run: |
          "$RUNNER_TEMP/professor-fence/.claude/scripts/dev.sh" iso test templates

  cross-compile:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: pfm/go.mod
          cache-dependency-path: pfm/go.sum

      # dev.sh owns the cross-platform compile and reproducibility verdict.
      - name: Build and assert a reproducible sha256 (dev.sh build pfm)
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        shell: bash
        run: .claude/scripts/dev.sh build pfm

  verify:
    name: pfm gate (dev.sh iso verify + test)
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Mirrors `.claude/scripts/dev.sh`'s own derivation: scratch artifacts land
      # outside the checkout at /tmp/<project>, <project> = the checkout
      # directory's basename with any leading dot stripped. Computed once here
      # (the runner's checkout name is not $REPO_ROOT's basename on this host)
      # so the upload-artifact step below references the same path dev.sh wrote.
      - name: Derive the scratch base directory
        run: |
          set -euo pipefail
          name="$(basename "$GITHUB_WORKSPACE")"; name="${name#.}"
          echo "TMP_BASE=/tmp/$name" >> "$GITHUB_ENV"

      - name: Fetch the lint base
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Verify pfm through the isolated fence
        run: .claude/scripts/dev.sh iso verify pfm

      - name: Test pfm through the isolated fence
        run: .claude/scripts/dev.sh iso test pfm

      - name: upload test-timing TSV
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pfm-test-timing
          path: |
            ${{ env.TMP_BASE }}/timing/**/*.tsv
            ${{ env.TMP_BASE }}/timing/**/*.json
            ${{ env.TMP_BASE }}/timing/**/profile/**
            ${{ env.TMP_BASE }}/timing/**/steps/*.prof.tsv
            ${{ env.TMP_BASE }}/timing/**/steps/*.xtrace
            ${{ env.TMP_BASE }}/timing/**/steps/*.hang/**
          if-no-files-found: warn
          retention-days: 14
