name: Plugin Security Scan

# HOL AI Plugin Scanner — the same pinned action and thresholds the
# awesome-ai-plugins catalog applies, so the source-side score is reproducible.

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: HOL AI Plugin Scanner
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: pfm/go.mod
          cache-dependency-path: pfm/go.sum

      # The scanner scores `.opencode/` as its own package, including its
      # generated LICENSE/SECURITY.md/opencode.jsonc — none of which are
      # tracked (see .gitignore). Generate both mirrors before it runs, or
      # it scores an absent, not a generated, tree.
      - name: Generate Codex and OpenCode mirrors
        shell: bash
        run: |
          set -euo pipefail
          (cd pfm && go run ./cmd/pfm codex build ..)
          (cd pfm && go run ./cmd/pfm opencode build ..)

      - name: Scan
        uses: hashgraph-online/ai-plugin-scanner-action@ff72bdc87402c9751fe9be6977de41c0cfcc514b # v1.2.706
        with:
          plugin_dir: "."
          min_score: 80
          fail_on_severity: high
          # .plugin-scanner.toml (fixture paths that plant fake credentials)
          # counts only where the author already holds push rights: a push, or
          # a pull request from this repository. A fork's pull request is
          # scanned with no repository suppressions.
          trust_repository_policy: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'true' || 'false' }}
