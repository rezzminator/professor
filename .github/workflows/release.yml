name: release

# The release/v{VERSION} -> main pull request's gate: its jobs run every check
# (`make release-check` runs the same ones locally). Merging it is the release:
# publish.yml tags v{VERSION} and publishes the pfm binaries. No tag is pushed by hand.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      version:
        description: Version used in test artifact names
        required: true
        default: dev
        type: string

permissions:
  contents: read

jobs:
  # HOL AI Plugin Scanner — the same pinned action and thresholds the
  # awesome-ai-plugins catalog applies, so the source-side score is reproducible.
  check:
    name: check
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: pfm/go.mod
          cache-dependency-path: pfm/go.sum

      - name: Build engine-sync
        uses: ./.github/actions/engine-sync

      # The scanner scores `.opencode/` as its own package, including its
      # generated LICENSE/SECURITY.md/opencode.jsonc — none of which are
      # tracked (see .gitignore). Generate both mirrors before it runs, or
      # it scores an absent, not a generated, tree. The project's
      # .claude/engine-sync.json opencode.mirrorFiles lists LICENSE and
      # SECURITY.md; the machine policy the action stages fills
      # opencode.jsonc from its opencode.permission.
      - name: Generate Codex and OpenCode mirrors
        shell: bash
        run: make check

      - name: Scan
        uses: hashgraph-online/ai-plugin-scanner-action@8c2dd4f9cc381ad56496ca44aab10ce19f6bdd0f # v1.2.813
        with:
          plugin_dir: "."
          min_score: 80
          fail_on_severity: high
          # .plugin-scanner.toml (fixture paths that plant fake credentials)
          # counts only where the author already holds push rights: a push, or
          # a pull request from this repository. A fork's pull request is
          # scanned with no repository suppressions.
          trust_repository_policy: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'true' || 'false' }}

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: pfm/go.mod
          cache-dependency-path: pfm/go.sum

      - name: Name the version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: echo "VERSION=${INPUT_VERSION:-v$(cat VERSION)}" >> "$GITHUB_ENV"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        shell: bash
        run: make release-binary RELEASE_VERSION="$VERSION"

      - name: Upload platform binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pfm_${{ env.VERSION }}_${{ matrix.goos }}_${{ matrix.goarch }}
          path: tmp/dist/pfm_${{ env.VERSION }}_${{ matrix.goos }}_${{ matrix.goarch }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: release
    # always(): a skipped required check counts as passed, so a failed build leg must fail `release` itself.
    needs: build
    if: always() && github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Every platform binary built
        if: needs.build.result != 'success'
        run: |
          echo "::error::build finished '${{ needs.build.result }}'; every platform binary must build before a release"
          exit 1

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: The version moved past main's, its authored release notes exist and pass the grammar
        run: make release
