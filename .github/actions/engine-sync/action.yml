name: engine-sync binary
description: >-
  Builds engine-sync, the single writer of every Codex and OpenCode artifact
  (pfm codex|opencode forward to it), from the plugins/engine-sync submodule,
  stages the shipped machine policy templates/global/engine-sync/config.json
  under $RUNNER_TEMP/engine-sync-config, and exports ENGINE_SYNC_BIN and
  XDG_CONFIG_HOME to every later step of the job (git, Go and pip then read
  their user config from that directory too). An absent source, or a policy
  absent, unreadable or unstageable, fails the job naming it, never a skipped
  or neutral mirror step. Needs Go set up and the repository checked out.

runs:
  using: composite
  steps:
    - name: Stage the machine policy and build engine-sync from plugins/engine-sync
      shell: bash
      run: |
        set -euo pipefail
        policy="$GITHUB_WORKSPACE/templates/global/engine-sync/config.json"
        config_home="$RUNNER_TEMP/engine-sync-config"
        if [ ! -f "$policy" ] || [ ! -r "$policy" ]; then
          echo "::error::engine-sync machine policy absent or unreadable: $policy"
          exit 1
        fi
        if ! mkdir -p "$config_home/engine-sync" || ! cp "$policy" "$config_home/engine-sync/config.json"; then
          echo "::error::engine-sync machine policy could not be staged from $policy into $config_home/engine-sync/config.json"
          exit 1
        fi
        src="$GITHUB_WORKSPACE/plugins/engine-sync"
        cause=""
        if [ ! -f "$src/go.mod" ]; then
          cause="$(git -C "$GITHUB_WORKSPACE" submodule update --init -- plugins/engine-sync 2>&1)" || true
        fi
        if [ ! -f "$src/go.mod" ]; then
          echo "::error::engine-sync source absent: plugins/engine-sync has no go.mod — CI cannot build the Codex and OpenCode compiler (git submodule update: ${cause:-no output})"
          exit 1
        fi
        bin="$RUNNER_TEMP/engine-sync/engine-sync"
        go -C "$src" build -o "$bin" ./cmd/engine-sync
        "$bin" version
        printf 'ENGINE_SYNC_BIN=%s\nXDG_CONFIG_HOME=%s\n' "$bin" "$config_home" >> "$GITHUB_ENV"
